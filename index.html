<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Programming Quiz</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-accent: #2563eb;
    --text-success: #15803d;
    --text-danger: #b91c1c;
    --on-accent: #ffffff;

    --surface-0: #ffffff;
    --surface-1: #f0f0f0;
    --bg-accent-muted: #eff6ff;
    --bg-success: #f0fdf4;
    --bg-danger: #fef2f2;

    --fill-accent: #2563eb;

    --border: #d4d4d4;
    --border-strong: #a3a3a3;
    --border-accent: #2563eb;
    --border-success: #22c55e;
    --border-danger: #ef4444;

    --radius: 8px;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  button:disabled {
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div id="quiz-container" style="max-width: 700px; margin: 0 auto; padding: 2rem;">
  <!-- Topic selector -->
  <div style="margin-bottom: 1.5rem;">
    <label for="topic-select" style="font-size: 14px; color: var(--text-secondary); margin-right: 8px;">Topic:</label>
    <select id="topic-select" onchange="switchTopic(this.value)"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background-color: var(--surface-0);">
      <option value="Java" selected>Java</option>
      <option value="CAndCPP">C/C++</option>
      <option value="C#">C#</option>
      <option value="PHP">PHP</option>
      <option value="Database">Database</option>
      <option value="Cloud">Cloud</option>
      <option value="Web">Web</option>
    </select>
  </div>

  <div style="margin-bottom: 1.5rem; display: flex; gap: 8px;">
    <button onclick="exportProgress()"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Export progress
    </button>

    <button onclick="document.getElementById('import-file').click()"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Import progress
    </button>

    <input type="file" id="import-file" accept="application/json" style="display:none"
      onchange="importProgress(event)" />
  </div>

  <div id="progress-section" style="margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 500;" id="question-number">Question 1 of 50</h2>
      <div style="font-size: 14px; color: var(--text-secondary);" id="score-display">Score: 0/0</div>
    </div>
    <div style="width: 100%; height: 4px; background-color: var(--surface-1); border-radius: 2px; overflow: hidden;">
      <div id="progress-bar"
        style="width: 2%; height: 100%; background-color: var(--fill-accent); transition: width 0.3s;"></div>
    </div>
  </div>

  <div id="jump-buttons"
    style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 1.5rem; max-height: 100px; overflow-y: auto;"></div>

  <div id="question-section" style="margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
      <div id="topic-tag"
        style="display: inline-flex; align-items: center; height: 32px; font-size: 12px; color: var(--text-accent); background-color: var(--bg-accent-muted); padding: 0 8px; border-radius: var(--radius);">
      </div>
      <div style="display: flex; gap: 4px;">
        <button id="copy-question-btn" onclick="copyQuestion()"
          style="padding: 4px; width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6b7280; transition: color 0.2s;"
          title="Copy question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>

        <button id="flag-btn" onclick="toggleFlag()"
          style="padding: 4px; width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;"
          title="Flag question">
          <svg id="flag-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
            <line x1="4" y1="22" x2="4" y2="15" />
          </svg>
        </button>
      </div>
    </div>

    <h3 id="question-text"
      style="font-size: 16px; font-weight: 500; margin: 0; white-space: pre-wrap; font-family: var(--font-mono); line-height: 1.5;">
    </h3>
  </div>

  <div id="options-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem;"></div>

  <div id="feedback-section"
    style="display: none; padding: 12px; border-radius: var(--radius); margin-bottom: 2rem; font-size: 14px; line-height: 1.6;">
    <div id="feedback-status" style="font-weight: 500; margin-bottom: 6px;"></div>
    <div id="feedback-text" style="font-size: 13px;"></div>

    <button id="clear-answer-btn" onclick="clearAnswer()"
      style="margin-top: 10px; padding: 6px 14px; font-size: 13px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Clear answer
    </button>
  </div>

  <div style="display: flex; gap: 8px; justify-content: space-between; margin-top: 1rem;">
    <button id="prev-btn" onclick="goToPrevious()"
      style="padding: 8px 16px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">←
      Previous</button>
    <button id="submit-btn" onclick="submitAnswer()"
      style="padding: 8px 24px; font-size: 14px; border: none; background-color: var(--fill-accent); color: var(--on-accent); border-radius: var(--radius); cursor: pointer; font-weight: 500;">Check
      answer</button>
  </div>

  <div id="complete-section"
    style="display: none; margin-top: 2rem; padding: 16px; background-color: var(--surface-1); border-radius: 12px; text-align: center;">
    <div style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">Quiz complete</div>
    <div id="final-score" style="font-size: 32px; font-weight: 500; color: var(--fill-accent); margin-bottom: 1rem;">
    </div>
    <button onclick="resetQuiz()"
      style="padding: 8px 24px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">Restart
      quiz</button>
  </div>
</div>

<script>
  // ========== JAVA QUESTIONS ==========
  const javaQuestions = [
    // ===== CORE JAVA (10) =====
    { topic: "Core Java", question: "Which of the following is a valid `main` method declaration?", options: ["public static void main(String args)", "public static void main(String[] args)", "public void main(String[] args)", "static void main(String args[])"], correct: 1, explanation: "Must be public, static, return void, and accept a String array. `public static void main(String[] args)` is the only valid signature." },
    { topic: "Core Java", question: "Which of the following is not a primitive type?", options: ["int", "boolean", "String", "char"], correct: 2, explanation: "String is a class (reference type), not a primitive. int, boolean, and char are primitives." },
    { topic: "Core Java", question: "What is the output?\n```java\nSystem.out.println(1 + 2 + \"3\");\n```", options: ["33", "123", "6", "15"], correct: 0, explanation: "1+2 evaluates first as int addition = 3, then 3 + \"3\" becomes string concatenation = \"33\"." },
    { topic: "Core Java", question: "A developer needs to perform two tasks:\n(a) Prevent a class from being subclassed\n(b) Declare a field whose value cannot be changed after initialization\n\nWhich keyword should be used for both tasks?", options: ["static", "final", "abstract", "const"], correct: 1, explanation: "`final` on a class prevents inheritance, and `final` on a field makes it immutable after assignment. `const` is not a Java keyword." },
    { topic: "Core Java", question: "What is autoboxing?", options: ["Converting a wrapper object to a primitive", "Converting a primitive to its corresponding wrapper object automatically", "Converting a String to int", "Creating an array"], correct: 1, explanation: "Autoboxing automatically converts primitives (e.g. int) into their wrapper class (Integer). Unboxing is the reverse." },
    { topic: "Core Java", question: "If no access modifier is specified on a class member, what is its access level?", options: ["public", "private", "protected", "default (package-private)"], correct: 3, explanation: "No modifier means 'default' (package-private). The member is accessible only within the same package, not subclasses outside the package." },
    { topic: "Core Java", question: "Does Java use pass-by-value or pass-by-reference?", options: ["Pass-by-reference for objects, pass-by-value for primitives", "Pass-by-value for everything", "Pass-by-reference for everything", "Depends on the JVM"], correct: 1, explanation: "Java is strictly pass-by-value. For objects, the reference value is passed, not the object itself. The original reference cannot be changed, but the object's state can be modified." },
    { topic: "Core Java", question: "A developer is reviewing static behavior in Java:\n(a) When does a static initializer block run?\n(b) Which of the following cannot be declared static?", options: ["(a) Once when the class is first loaded (b) A constructor", "(a) Every time an instance is created (b) A field", "(a) Only when explicitly called (b) A method", "(a) Once per object instantiation (b) A block"], correct: 0, explanation: "(a) A static initializer block executes exactly once when the class is loaded by the JVM.\n(b) Constructors cannot be static, abstract, final, or synchronized." },
    { topic: "Core Java", question: "Can a private method of a superclass be overridden in a subclass?", options: ["Yes, it can be overridden like any other method", "No, it is hidden, not overridden", "Yes, but only with protected access", "No, it causes a compilation error"], correct: 1, explanation: "Private methods are not inherited and are not visible to subclasses. If a subclass defines a method with the same signature, it is a new method (hiding), not overriding." },
    { topic: "Core Java", question: "What is the difference between method overloading and method overriding?", options: ["Overloading changes return type; overriding changes parameters", "Overloading has same signature, different parameters; overriding has same signature in subclass", "Overloading is compile-time polymorphism; overriding is runtime polymorphism", "Overloading requires inheritance; overriding does not"], correct: 2, explanation: "Overloading is defining methods with the same name but different parameters in the same class (compile-time polymorphism). Overriding is redefining a superclass method in a subclass with the same signature (runtime polymorphism)." },

    // ===== OOP & INHERITANCE (5) =====
    { topic: "OOP & Inheritance", question: "Which class is the root of all Java classes?", options: ["Object", "Class", "Main", "Root"], correct: 0, explanation: "Every class implicitly extends Object." },
    { topic: "OOP & Inheritance", question: "Which of the following allows a class to have multiple inheritance of type in Java?", options: ["Extending multiple classes", "Implementing multiple interfaces", "Using `super` keyword", "Java does not support multiple inheritance of any kind"], correct: 1, explanation: "Java allows implementing multiple interfaces, giving multiple inheritance of type (not implementation)." },
    { topic: "OOP & Inheritance", question: "Which statement about `String` is true?", options: ["String is mutable", "String is immutable", "String can be changed with `append()`", "String is a primitive type"], correct: 1, explanation: "Strings are immutable in Java; `append()` belongs to StringBuilder." },
    { topic: "OOP & Inheritance", question: "Which method is used to compare two strings for content equality?", options: ["==", "equals()", "compareTo()", "hashCode()"], correct: 1, explanation: "`equals()` compares content; `==` compares references." },
    { topic: "OOP & Inheritance", question: "Which annotation indicates a method is intended to override a superclass method?", options: ["@Override", "@Overload", "@Inherit", "@Super"], correct: 0, explanation: "`@Override` triggers a compiler check that the method actually overrides a superclass method." },

    // ===== COLLECTIONS (5) =====
    { topic: "Collections", question: "A developer needs to choose the right collection for two scenarios:\n(a) Fast index-based access backed by a resizable array\n(b) Preserve insertion order while disallowing duplicates\n\nWhich combination of collections is correct?", options: ["(a) LinkedList (b) HashSet", "(a) ArrayList (b) LinkedHashSet", "(a) ArrayList (b) TreeSet", "(a) Vector (b) HashMap"], correct: 1, explanation: "(a) ArrayList is backed internally by a dynamically resizing array, giving O(1) index access.\n(b) LinkedHashSet maintains a linked list through its entries, preserving insertion order while disallowing duplicates." },
    { topic: "Collections", question: "A developer needs a Map with keys sorted in natural order. Which combination correctly describes the required implementation and interface?", options: ["HashMap with Comparator", "TreeMap with Comparable (or Comparator)", "LinkedHashMap with Serializable", "Hashtable with Iterable"], correct: 1, explanation: "TreeMap sorts keys by natural order (Comparable's compareTo()) or by a custom Comparator. HashMap does not sort; LinkedHashMap preserves insertion order, not sorted order." },
    { topic: "Collections", question: "A developer is reviewing HashMap internals:\n(a) What is the default load factor?\n(b) What happens when two objects have the same hash code but are not equal?\n\nWhich combination is correct?", options: ["(a) 0.5 (b) One overwrites the other", "(a) 0.75 (b) They are stored in the same bucket", "(a) 1.0 (b) An exception is thrown", "(a) 0.25 (b) They cannot be added"], correct: 1, explanation: "(a) The default load factor is 0.75, balancing space and time cost.\n(b) Objects with the same hash code land in the same bucket and are differentiated by equals(). Both entries are stored (as a linked list or tree node)." },
    { topic: "Collections", question: "Which statement about HashMap and Hashtable is correct?", options: ["HashMap is synchronized, Hashtable is not", "Hashtable allows null keys and values, HashMap does not", "HashMap is not synchronized and allows one null key and multiple null values; Hashtable is synchronized and disallows null keys/values", "Both are synchronized and disallow null keys/values"], correct: 2, explanation: "HashMap is not thread-safe and permits one null key and multiple null values. Hashtable is synchronized (legacy) and throws NullPointerException on null keys or values. For concurrent use, prefer ConcurrentHashMap over Hashtable." },
    { topic: "Collections", question: "A developer needs to define ordering for objects used in a TreeSet:\n(a) Which interface defines the natural ordering of a class?\n(b) Which interface provides external custom ordering without modifying the class?\n\nWhich combination is correct?", options: ["(a) Comparator (b) Comparable", "(a) Comparable (b) Comparator", "(a) Iterable (b) Serializable", "(a) Serializable (b) Iterable"], correct: 1, explanation: "(a) Comparable's compareTo() defines the natural ordering and is implemented by the class itself.\n(b) Comparator provides external custom ordering via compare() and does not require modifying the target class. TreeSet/TreeMap accept either." },

    // ===== CODING (5) =====
    { topic: "Coding", question: "What is the output?\n```java\nString s = \"Hello\";\ns.concat(\" World\");\nSystem.out.println(s);\n```", options: ["Hello World", "Hello", "World", "Compilation error"], correct: 1, explanation: "String is immutable; concat() returns a new String that is discarded here. The original reference s still points to \"Hello\"." },
    { topic: "Coding", question: "What is the output?\n```java\nboolean b = false;\nif (b = true) {\n    System.out.println(\"Yes\");\n} else {\n    System.out.println(\"No\");\n}\n```", options: ["Yes", "No", "Compilation error", "Runtime error"], correct: 0, explanation: "This is assignment (=), not comparison (==). `b = true` assigns true to b and evaluates to true, so the if-branch runs and prints \"Yes\". A common trap — always use == or .equals() for comparison." },
    { topic: "Coding", question: "What is the output?\n```java\nint x = 5;\nint y = x++ + ++x;\nSystem.out.println(y);\n```", options: ["10", "11", "12", "13"], correct: 2, explanation: "x++ uses 5 (post-increment) then x becomes 6. ++x increments x to 7 (pre-increment) then uses 7. y = 5 + 7 = 12." },
    { topic: "Coding", question: "A developer writes two loops:\n\nLoop 1:\n```java\nfor(int i = 0; i < 5; i++) {\n    if(i == 2) continue;\n    System.out.print(i);\n}\n```\nLoop 2:\n```java\nfor(int i = 0; i < 5; i++) {\n    if(i == 3) break;\n    System.out.print(i);\n}\n```\nWhat is the output of each loop?", options: ["Loop 1: 0134 / Loop 2: 012", "Loop 1: 1245 / Loop 2: 0123", "Loop 1: 0134 / Loop 2: 0123", "Loop 1: 1245 / Loop 2: 012"], correct: 0, explanation: "Loop 1: continue skips only i==2, printing 0, 1, 3, 4 → \"0134\".\nLoop 2: break exits the loop entirely at i==3, printing 0, 1, 2 → \"012\".\nKey difference: continue skips one iteration; break terminates the loop." },
    { topic: "Coding", question: "What is the output?\n```java\nint a = 10, b = 20;\na = a + b;\nb = a - b;\na = a - b;\nSystem.out.println(a + \" \" + b);\n```", options: ["10 20", "20 10", "30 10", "10 30"], correct: 1, explanation: "Classic swap without a temp variable: a = 30, b = 30-20 = 10, a = 30-10 = 20. Result: a=20, b=10." },

    // ===== OOP CALC (15) =====
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass Test {\n    static int count = 0;\n    Test() { count++; }\n    public static void main(String[] args) {\n        new Test(); new Test(); new Test();\n        System.out.println(count);\n    }\n}\n```", options: ["0", "1", "2", "3"], correct: 3, explanation: "Each constructor call increments the shared static counter. Three instances = 3." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A { int x = 5; }\nclass B extends A {\n    int x = 10;\n    void print() { System.out.println(super.x + \" \" + x); }\n}\nnew B().print();\n```", options: ["10 10", "5 10", "10 5", "5 5"], correct: 1, explanation: "Fields are not polymorphic. super.x accesses A's x (5); x accesses B's x (10)." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nabstract class Shape { abstract double area(); }\nclass Circle extends Shape {\n    double radius;\n    Circle(double radius) { this.radius = radius; }\n    double area() { return Math.PI * radius * radius; }\n}\nSystem.out.printf(\"%.2f\", new Circle(1).area());\n```", options: ["3.14", "3.14159", "1.00", "6.28"], correct: 0, explanation: "Area = π × 1² ≈ 3.14159..., formatted to 2 decimals = 3.14." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A {\n    void print() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    void print() { System.out.println(\"B\"); }\n}\nA obj = new B();\nobj.print();\n```", options: ["A", "B", "Compilation error", "Runtime error"], correct: 1, explanation: "Method overriding uses dynamic dispatch based on the actual object type, B." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass Parent {\n    Parent() { System.out.print(\"P\"); }\n}\nclass Child extends Parent {\n    Child() { System.out.print(\"C\"); }\n}\nnew Child();\n```", options: ["PC", "CP", "P", "C"], correct: 0, explanation: "A subclass constructor implicitly calls super() first, so Parent's constructor runs before Child's: \"PC\"." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass Test {\n    void m(int x) { System.out.print(\"int \"); }\n    void m(Integer x) { System.out.print(\"Integer \"); }\n    public static void main(String[] args) {\n        new Test().m(5);\n    }\n}\n```", options: ["int", "Integer", "Compilation error", "Runtime error"], correct: 0, explanation: "The compiler prefers an exact primitive match (int) over autoboxing to Integer." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A { int x = 10; }\nclass B extends A { int x = 20; }\nA a = new B();\nSystem.out.println(a.x);\n```", options: ["10", "20", "Compilation error", "Runtime error"], correct: 0, explanation: "Fields are resolved statically by the declared type (A), not the runtime type. So a.x = 10." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A { static int x = 5; }\nclass B extends A { static int x = 10; }\nA a = new B();\nSystem.out.println(a.x);\n```", options: ["5", "10", "0", "Compilation error"], correct: 0, explanation: "Static fields, like instance fields, are resolved by the declared reference type (A), not the runtime type. a.x = 5." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A {\n    static void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    static void m() { System.out.println(\"B\"); }\n}\nA a = new B();\na.m();\n```", options: ["A", "B", "Compilation error", "Runtime error"], correct: 0, explanation: "Static methods are not polymorphic — they're resolved at compile time based on the reference type (A), so \"A\" prints." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A { int getValue() { return 10; } }\nclass B extends A { int getValue() { return 20; } }\nclass C extends B { int getValue() { return super.getValue() + 5; } }\nSystem.out.println(new C().getValue());\n```", options: ["10", "20", "25", "35"], correct: 2, explanation: "C.getValue() calls super.getValue() → B.getValue() returns 20, plus 5 = 25." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A {\n    int x = 5;\n    void print() { System.out.println(this.x); }\n}\nclass B extends A {\n    int x = 10;\n    void print() {\n        super.print();\n        System.out.println(x);\n    }\n}\nnew B().print();\n```", options: ["5 then 5", "10 then 10", "5 then 10", "10 then 5"], correct: 2, explanation: "super.print() runs A's print(), where this.x resolves to A's field (5) since fields aren't polymorphic. Then B's print() prints its own x (10)." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass A {\n    int x = 1;\n    void print() { System.out.println(x); }\n}\nclass B extends A {\n    int x = 2;\n    void print() { System.out.println(x); }\n}\nA a = new B();\na.print();\nSystem.out.println(a.x);\n```", options: ["2 then 2", "1 then 1", "2 then 1", "1 then 2"], correct: 2, explanation: "print() is overridden (dynamic dispatch → B's x = 2). But a.x is field access resolved by declared type A → 1." },
    { topic: "OOP Calc", question: "What happens if class B tries to override a final method from class A?\n```java\nclass A {\n    final void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    // attempting to override m()\n}\n```", options: ["It works normally", "Compilation error", "Runtime error", "The method is hidden"], correct: 1, explanation: "A final method cannot be overridden by a subclass. Attempting to do so is a compile-time error." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass Data {\n    public int a = 1;\n    private int b = 2;\n}\n\nField[] fields = Data.class.getFields();\nSystem.out.println(fields.length);\n```", options: ["0", "1", "2", "Error"], correct: 1, explanation: "getFields() returns only public fields; private b is excluded." },
    { topic: "OOP Calc", question: "What is the output?\n```java\nclass Obj {\n    public int x = 1;\n}\n\nObj o = new Obj();\nField field = Obj.class.getField(\"x\");\nfield.setInt(o, 10);\nSystem.out.println(o.x);\n```", options: ["1", "10", "Error", "IllegalAccessException"], correct: 1, explanation: "Reflection allows modifying public fields via setInt(); the original object is updated." },

    // ===== COMPLEX OOP CALC (15) =====
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    A() { System.out.println(\"A constructor\"); }\n}\nclass B extends A {\n    B() {\n        this(5);\n        System.out.println(\"B constructor\");\n    }\n    B(int x) { System.out.println(\"B int constructor\"); }\n}\nnew B();\n```", options: ["A constructor, B int constructor, B constructor", "A constructor, B constructor", "B int constructor, A constructor, B constructor", "Compilation error"], correct: 0, explanation: "new B() calls B(), which calls this(5) → B(int). B(int) implicitly calls super() first, printing \"A constructor\", then \"B int constructor\", then control returns to B() which prints \"B constructor\"." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass Parent {\n    int x = 5;\n    Parent() { print(); }\n    void print() { System.out.println(x); }\n}\nclass Child extends Parent {\n    int x = 10;\n    void print() { System.out.println(x); }\n}\nnew Child();\n```", options: ["5", "10", "0", "Compilation error"], correct: 2, explanation: "Parent's constructor calls print(), which is overridden by Child — but Child's x field hasn't been initialized yet at that point, so it's still the default value 0." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\ninterface A {\n    default void print() { System.out.println(\"A\"); }\n}\ninterface B {\n    default void print() { System.out.println(\"B\"); }\n}\nclass C implements A, B {\n    public void print() {\n        A.super.print();\n        B.super.print();\n        System.out.println(\"C\");\n    }\n}\nnew C().print();\n```", options: ["A B C", "A C", "B C", "Compilation error"], correct: 0, explanation: "C resolves the diamond by overriding print() and explicitly calling both interface defaults using Interface.super.method(). Output: A then B then C." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    int x = 1;\n    A() { print(); }\n    void print() { System.out.println(\"A:\" + x); }\n}\nclass B extends A {\n    int x = 2;\n    B() { print(); }\n    void print() { System.out.println(\"B:\" + x); }\n}\nclass C extends B {\n    int x = 3;\n    C() { print(); }\n    void print() { System.out.println(\"C:\" + x); }\n}\nnew C();\n```", options: ["A:1 B:2 C:3", "C:0 C:0 C:3", "A:0 B:0 C:3", "A:1 B:2 C:3"], correct: 1, explanation: "During construction, the most specific override is called, but fields are not yet initialized for the subclass. So each constructor invokes print() of the actual class (C), but C's x is still 0 until C's initializer runs. Output: C:0 (from A's constructor), C:0 (from B's constructor), C:3 (from C's constructor)." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    { System.out.print(\"AI \"); }\n    A() { System.out.print(\"AC \"); }\n}\nclass B extends A {\n    { System.out.print(\"BI \"); }\n    B() { System.out.print(\"BC \"); }\n}\nnew B();\n```", options: ["AI AC BI BC", "AC AI BC BI", "AI BI AC BC", "AC BC AI BI"], correct: 0, explanation: "Instance initializer blocks run before the constructor, and superclass initializer/constructor run before subclass initializer/constructor. Order: A instance init → A constructor → B instance init → B constructor → \"AI AC BI BC\"." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nabstract class Animal {\n    Animal() { sound(); }\n    abstract void sound();\n}\nclass Dog extends Animal {\n    private String name = \"Rex\";\n    Dog() { name = \"Buddy\"; }\n    void sound() { System.out.println(name + \" barks\"); }\n}\nnew Dog();\n```", options: ["Rex barks", "Buddy barks", "null barks", "Compilation error"], correct: 2, explanation: "Animal constructor calls sound(), which is overridden in Dog. But Dog's name field is not yet initialized at that point (it's null), because subclass field initializers run after superclass constructor. Output: null barks." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    void m(Object o) { System.out.println(\"Object\"); }\n    void m(String s) { System.out.println(\"String\"); }\n}\nclass B extends A {\n    void m(Object o) { System.out.println(\"B Object\"); }\n}\nA a = new B();\na.m(null);\n```", options: ["Object", "String", "B Object", "Compilation error"], correct: 1, explanation: "Overload resolution happens at compile time using the declared type A. A has both m(Object) and m(String); null matches both, but String is more specific, so A.m(String) is chosen. Dynamic dispatch then runs A.m(String) because B does not override m(String). Output: String." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass Init {\n    static int x = 5;\n    static { x *= 2; }\n}\nclass Child extends Init {\n    static int y = x + 3;\n    static { y += 2; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        System.out.println(Child.x + \" \" + Child.y);\n    }\n}\n```", options: ["10 15", "10 13", "5 8", "Compilation error"], correct: 0, explanation: "Init static initialization: x=5, then x*=2 → x=10. Child static init: y = x+3 = 13, then y+=2 → 15. Output: 10 15." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    static int x = 10;\n    static { System.out.print(\"A1:\" + x + \" \"); }\n    static void print() { System.out.print(\"A\" + x + \" \"); }\n    void instancePrint() { print(); }\n}\nclass B extends A {\n    static int x = 20;\n    static { System.out.print(\"B1:\" + x + \" \"); }\n    static void print() { System.out.print(\"B\" + x + \" \"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        System.out.print(\"Start \");\n        A obj = new B();\n        System.out.print(\"Obj \");\n        obj.instancePrint();\n        System.out.print(\"Static \");\n        obj.print();\n        System.out.print(\"Field \");\n        System.out.print(((A)obj).x);\n    }\n}\n```", options: ["Start A1:10 B1:20 Obj A10 Static A10 Field 10", "Start A1:10 B1:20 Obj B20 Static B20 Field 20", "Start B1:20 A1:10 Obj A10 Static B20 Field 10", "Start A1:10 B1:20 Obj A10 Static B20 Field 20"], correct: 0, explanation: "Class loading: B extends A, so A's static init runs first (x=10, prints A1:10). Then B's static init (x=20, prints B1:20). After 'Obj ': obj.instancePrint() calls A's instancePrint (not overridden), which calls static print() — resolved at compile time to A.print(), so prints A10 (A.x=10). 'Static ': obj.print() again A.print() → A10. 'Field ': ((A)obj).x accesses field by declared type A → 10. Full output as option A." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass Outer {\n    static int x = 5;\n    static class Inner {\n        static int x = 10;\n        int x = 20;\n        void print() {\n            int x = 30;\n            System.out.print(x + \" \");\n            System.out.print(this.x + \" \");\n            System.out.print(Inner.x + \" \");\n            System.out.print(Outer.x);\n        }\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        new Outer.Inner().print();\n    }\n}\n```", options: ["30 20 10 5", "30 10 20 5", "20 30 10 5", "30 20 5 10"], correct: 0, explanation: "Local variable x=30 shadows both instance and static fields. this.x refers to the instance field (x=20) because Inner declares an instance field x hiding the static one. Inner.x explicitly accesses the static field (10). Outer.x accesses the outer static field (5). Output: 30 20 10 5." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass Parent {\n    static int x = 5;\n    static void m() { System.out.print(\"P\" + x); }\n}\nclass Child extends Parent {\n    static int x = 10;\n    static void m() { System.out.print(\"C\" + x); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Parent p = new Child();\n        p.m();\n        System.out.print(\" \");\n        ((Child)p).m();\n    }\n}\n```", options: ["P5 C10", "C10 C10", "P5 P5", "C10 P5"], correct: 0, explanation: "p.m() uses reference type Parent → Parent.m() prints P5. Cast to Child gives Child reference → Child.m() prints C10. Output: P5 C10." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    static int x = 5;\n    static { System.out.print(\"A\"); }\n}\nclass B extends A {\n    static int y = 10;\n    static { System.out.print(\"B\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        System.out.print(B.y);\n        System.out.print(B.x);\n    }\n}\n```", options: ["AB105", "AB510", "A5B10", "BA105"], correct: 0, explanation: "When B.y is accessed, B is initialized: A static block runs (prints A), then B static block (prints B). Then prints y=10, then x=5 (from A). Output: AB105." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass A {\n    static void m() { System.out.println(\"A static\"); }\n    void n() { m(); }\n}\nclass B extends A {\n    static void m() { System.out.println(\"B static\"); }\n}\npublic class Test {\n    public static void main(String[] args) {\n        A a = new B();\n        a.n();\n    }\n}\n```", options: ["A static", "B static", "Compilation error", "Runtime error"], correct: 0, explanation: "a.n() calls A's n() (not overridden). Inside n(), m() is static and resolved at compile time based on the class containing n() (A), so A.m() is invoked, printing \"A static\"." },
    { topic: "Complex OOP Calc", question: "What is the output?\n```java\nclass Test {\n    static { System.out.print(\"S\"); }\n    { System.out.print(\"I\"); }\n    Test() { System.out.print(\"C\"); }\n    public static void main(String[] args) {\n        new Test();\n        new Test();\n    }\n}\n```", options: ["SSICIC", "SICIC", "SICC", "ICIC"], correct: 1, explanation: "Static block runs once when class loads: prints S. Then each instantiation runs instance block (I) then constructor (C): so first object prints IC, second prints IC. Overall: SICIC." },
    { topic: "Complex OOP Calc", question: "Given the following classes:\n```java\nclass Parent {\n    public int id = 1;\n    public static int count = 10;\n    protected String name = \"P\";\n    private boolean flag = true;\n}\n\nclass Child extends Parent {\n    public int id = 2;             \n    public static int count = 20;  \n    public String name = \"C\";      \n    private boolean flag = true;   \n    public int own = 5;\n}\n```\nWhat is the output?\n```java\nField[] f1 = Child.class.getFields();\nField[] f2 = Child.class.getDeclaredFields();\nField[] f3 = Parent.class.getFields();\nSystem.out.println(f1.length + \" \" + f2.length + \" \" + f3.length);\n```", options: ["4 5 2", "6 5 2", "4 5 3", "3 5 2"], correct: 0, explanation: "f1 = Child.class.getFields():\n- Returns PUBLIC fields of Child AND inherited PUBLIC fields from Parent, deduplicated by name (the most derived/hiding field wins).\n- Child's public fields: id, count (static), name, own → 4 fields.\n- Parent's public fields: id and count are HIDDEN by Child's same-named fields, so they are excluded.\n- Parent's name is protected (not public), so it is never eligible.\n→ f1.length = 4\n\nf2 = Child.class.getDeclaredFields():\n- Returns ALL fields declared directly in Child (any modifier, static or instance), no inheritance traversal.\n- Child declares: id, count (static), name, flag (private), own → 5 fields.\n→ f2.length = 5\n\nf3 = Parent.class.getFields():\n- Parent's public fields: id, count (static) → 2 fields.\n- name is protected; flag is private → excluded.\n→ f3.length = 2\n\nOutput: 4 5 2." },

    // ===== COMPLEX OOP CALC (LONG) (5) =====
    { topic: "Complex OOP Calc (Long)", question: "What is the output?\n```java\nclass Base {\n    int value = 1;\n    Base() { add(2); }\n    void add(int v) { value += v; }\n    int getValue() { return value; }\n}\nclass Derived extends Base {\n    Derived() { add(3); }\n    @Override\n    void add(int v) { value += v * 2; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Base b = new Derived();\n        System.out.println(b.getValue());\n    }\n}\n```", options: ["6", "9", "11", "15"], correct: 2, explanation: "Base constructor calls add(2), which is dynamically dispatched to Derived.add(2). value is 1 initially, then 1 + 4 = 5. After that, Derived constructor calls add(3) → 5 + 6 = 11. Output: 11." },
    { topic: "Complex OOP Calc (Long)", question: "What is the output?\n```java\nclass Parent {\n    int x = 1;\n    void print() {\n        System.out.println(x);\n    }\n    Parent() {\n        print();\n    }\n}\nclass Child extends Parent {\n    int x = 2;\n    void print() {\n        System.out.println(x);\n    }\n    Child() {\n        x = 3;\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Parent p = new Child();\n        p.print();\n    }\n}\n```", options: ["1 then 2", "0 then 3", "2 then 3", "1 then 3"], correct: 1, explanation: "Parent constructor calls print(), dynamically dispatched to Child.print(). At that moment Child.x is still 0 (field initializers run after super constructor). So first output: 0. After Child constructor body sets x=3, p.print() again dispatches to Child.print() and prints 3. Output: 0 then 3." },
    { topic: "Complex OOP Calc (Long)", question: "What is the output?\n```java\nclass A {\n    static int count = 0;\n    A() { count++; }\n    static int getCount() { return count; }\n}\nclass B extends A {\n    B() { count += 2; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        A a = new B();\n        B b = new B();\n        System.out.println(A.getCount());\n    }\n}\n```", options: ["4", "5", "6", "7"], correct: 2, explanation: "Start count=0. First new B(): A constructor runs (count++ → 1), then B constructor runs (count += 2 → 3). Second new B(): A constructor runs (count++ → 4), then B constructor runs (count += 2 → 6). Final count = 6. Output: 6." },
    { topic: "Complex OOP Calc (Long)", question: "What is the output?\n```java\nclass A {\n    int x = 1;\n    A() { x = 2; }\n}\nclass B extends A {\n    int x = 3;\n    B() { x = 4; }\n    void print() {\n        System.out.println(super.x + \" \" + x);\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        B b = new B();\n        b.print();\n    }\n}\n```", options: ["2 4", "3 4", "1 4", "2 3"], correct: 0, explanation: "In A constructor, x refers to A's field (not overridden by B), set to 2. In B constructor, B's x is initialized to 3 (field initializer), then set to 4. print() uses super.x (A's x = 2) and x (B's x = 4). Output: 2 4." },
    { topic: "Complex OOP Calc (Long)", question: "What is the output?\n```java\nclass Counter {\n    static int total = 0;\n    int id;\n    Counter() {\n        id = ++total;\n    }\n    static void reset() {\n        total = 0;\n    }\n}\npublic class Test {\n    public static void main(String[] args) {\n        Counter c1 = new Counter();\n        Counter c2 = new Counter();\n        Counter.reset();\n        Counter c3 = new Counter();\n        System.out.println(c1.id + \" \" + c2.id + \" \" + c3.id);\n    }\n}\n```", options: ["1 2 1", "1 2 3", "0 0 1", "1 2 2"], correct: 0, explanation: "First c1: total becomes 1, id=1. c2: total=2, id=2. reset sets total=0. c3: total becomes 1, id=1. Output: 1 2 1." },

    // ===== TRAP CODING (15) =====
    { topic: "Trap Coding", question: "What is the output?\n```java\ninterface I1 { int x = 10; }\ninterface I2 { int x = 20; }\n\nclass C implements I1, I2 {\n    void print() {\n        System.out.println(x);\n    }\n}\n\nnew C().print();\n```", options: ["10", "20", "Compilation error: reference to x is ambiguous", "Runtime error: NoSuchFieldError"], correct: 2, explanation: "Both I1.x and I2.x are implicitly public static final, and C inherits both. When the same field name is inherited from multiple interfaces and no class/superclass field overrides it, an unqualified reference to `x` is ambiguous at compile time → compilation error. To fix it, qualify the reference: I1.x or I2.x.\n\nKey trap: many developers assume I1.x (10) wins because I1 is listed first, or assume I2.x (20) wins because it's 'more recent'. Java has no such ordering rule — it's simply ambiguous.\n\nBonus rule: if class C (or its superclass) declared its own `x`, that field would take precedence over both interface constants and the code would compile (class/superclass fields shadow interface fields)." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nclass Test {\n    int x = 10;\n    void method(int x) {\n        x = x + 10;\n    }\n    void print() { System.out.println(x); }\n}\nTest t = new Test();\nt.method(5);\nt.print();\n```", options: ["10", "15", "20", "5"], correct: 0, explanation: "Inside method(int x), the parameter x shadows the field x. The assignment x = x + 10 modifies the local parameter, not the field. The field remains 10." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nString s1 = \"Java\";\nString s2 = \"Ja\" + \"va\";\nSystem.out.println(s1 == s2);\n```", options: ["true", "false", "Compilation error", "Runtime error"], correct: 0, explanation: "Both s1 and s2 are compile-time constants because \"Ja\" and \"va\" are literals. The compiler concatenates them into \"Java\", and string interning ensures both refer to the same object in the string pool. So == is true." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nInteger a = 100;\nInteger b = 100;\nInteger c = 200;\nInteger d = 200;\nSystem.out.println(a == b);\nSystem.out.println(c == d);\n```", options: ["true then true", "true then false", "false then true", "false then false"], correct: 1, explanation: "Integer caches values from -128 to 127. 100 is in that range, so a and b refer to the same cached object (== true). 200 is outside, so c and d are distinct objects (== false)." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nint[] arr = {1, 2, 3};\nList<int[]> list = Arrays.asList(arr);\nSystem.out.println(list.size());\nSystem.out.println(list.get(0)[0]);\n```", options: ["1 then 1", "3 then 1", "1 then 3", "3 then 3"], correct: 0, explanation: "Arrays.asList(T... a) treats a primitive array int[] as a single object (because int[] is not a T[] of objects). So list contains one element: the array itself. list.size() = 1, and list.get(0)[0] = arr[0] = 1. Output: 1 then 1." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nint x = 1;\nx += x++ + ++x;\nSystem.out.println(x);\n```", options: ["4", "5", "6", "7"], correct: 1, explanation: "For x += expr, Java saves the original value of x (1), then evaluates expr: x++ uses 1 (x becomes 2), ++x increments to 3 and uses 3, so expr = 1 + 3 = 4. Then x = saved 1 + 4 = 5." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nBoolean b1 = true;\nBoolean b2 = true;\nSystem.out.println(b1 == b2);\n\nBoolean b3 = new Boolean(true);\nBoolean b4 = new Boolean(true);\nSystem.out.println(b3 == b4);\n```", options: ["true then true", "true then false", "false then true", "false then false"], correct: 1, explanation: "Boolean.valueOf() and autoboxing use cached Boolean.TRUE/FALSE constants, so b1 and b2 refer to same object (== true). But new Boolean(true) creates distinct objects, so b3 == b4 is false." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nclass Test {\n    static int test() {\n        try {\n            return 1;\n        } finally {\n            return 2;\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(test());\n    }\n}\n```", options: ["1", "2", "Compilation error", "Runtime error"], correct: 1, explanation: "The finally block always executes, and if it contains a return statement, it overrides the try block's return value. So output is 2." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nclass A {\n    int x = 1;\n    A() { x = 2; }\n}\nclass B extends A {\n    int x = 3;\n    B() { x = 4; }\n}\nA a = new B();\nSystem.out.println(a.x);\n```", options: ["1", "2", "3", "4"], correct: 1, explanation: "Field access a.x uses declared type A, so it reads A's x. A's constructor sets A.x = 2, so output is 2. B's x is a separate field and not affected." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nint[] arr = {1, 2, 3};\nint[] arr2 = arr.clone();\narr2[0] = 99;\nSystem.out.println(arr[0] + \",\" + arr2[0]);\n\nint[][] matrix = {{1,2},{3,4}};\nint[][] copy = matrix.clone();\ncopy[0][0] = 99;\nSystem.out.println(matrix[0][0]);\n```", options: ["1,99 then 1", "99,99 then 99", "1,99 then 99", "99,1 then 1"], correct: 2, explanation: "clone() creates a shallow copy. For 1D array of primitives, elements are copied, so arr2 is independent: arr[0]=1, arr2[0]=99. But for 2D array (array of arrays), clone copies the outer array only; inner arrays are shared. So copy[0][0]=99 also changes matrix[0][0] to 99. Output: 1,99 then 99." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nString s1 = new String(\"Java\");\nString s2 = \"Java\";\nString s3 = s1.intern();\nSystem.out.println(s1 == s2);\nSystem.out.println(s2 == s3);\nSystem.out.println(s1 == s3);\n```", options: ["false true false", "true true true", "false true true", "false false false"], correct: 0, explanation: "s1 is a new String object on heap, s2 is a literal in string pool. s1.intern() returns the pooled instance \"Java\", which is same as s2. So s1 == s2 false, s2 == s3 true, s1 == s3 false." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nclass A {\n    static int x = 5;\n    static int getX() { return x; }\n}\nclass B extends A {\n    static int x = 10;\n    static int getX() { return x; }\n}\npublic class Test {\n    public static void main(String[] args) {\n        A a = new B();\n        System.out.println(a.x);\n        System.out.println(a.getX());\n    }\n}\n```", options: ["5 then 5", "5 then 10", "10 then 5", "10 then 10"], correct: 0, explanation: "Field access a.x uses declared type A → 5. Static method getX() is resolved at compile time based on declared type A → A.getX() returns A's x (5). Static methods are not polymorphic." },
    { topic: "Trap Coding", question: "What is the output?\n```java\ninterface MyInterface {\n    default void m() {\n        System.out.println(\"Default\");\n    }\n}\nclass Test implements MyInterface {\n    void m() {\n        System.out.println(\"Override\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Test().m();\n    }\n}\n```", options: ["Default", "Override", "Compilation error", "Runtime error"], correct: 2, explanation: "The class Test implements MyInterface but declares m() without the public modifier. Since interface methods are implicitly public, an overriding method cannot reduce visibility (it must be public). This causes a compilation error. The correct declaration would be `public void m()`." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nint x = 1;\nswitch(x) {\n    case 1: System.out.print(\"one\");\n    case 2: System.out.print(\"two\");\n    case 3: System.out.print(\"three\");\n}\n```", options: ["one", "onetwothree", "one two three", "Compilation error"], correct: 1, explanation: "No break statements means execution falls through all matching and subsequent cases: \"onetwothree\"." },
    { topic: "Trap Coding", question: "What is the output?\n```java\nString str;\nSystem.out.println(str.length());\n```", options: ["0", "null", "NullPointerException", "Compilation error"], correct: 3, explanation: "The local variable `str` is declared but not initialized. In Java, local variables must be initialized before use; otherwise, the compiler throws a compilation error. The code will not compile, so no runtime exception (like NullPointerException) can occur." },

    // ===== EXCEPTION HANDLING (5) =====
    { topic: "Exception Handling", question: "A developer needs to distinguish between checked and unchecked exceptions:\n(a) Which of the following is a checked exception?\n(b) Which of the following is an unchecked exception?", options: ["(a) NullPointerException (b) IOException", "(a) IOException (b) NullPointerException", "(a) IllegalArgumentException (b) SQLException", "(a) ArithmeticException (b) ClassNotFoundException"], correct: 1, explanation: "(a) IOException (and its subclasses like FileNotFoundException) is checked — the compiler forces you to catch or declare it.\n(b) NullPointerException extends RuntimeException, making it unchecked. IllegalArgumentException and ArithmeticException are also unchecked; SQLException and ClassNotFoundException are checked." },
    { topic: "Exception Handling", question: "A developer writes:\n```java\nvoid readFile() throws IOException {\n    if (file == null)\n        throw new IOException(\"File missing\");\n}\n```\nWhat is the difference between `throw` and `throws` in this code?", options: ["`throw` declares the exception; `throws` actually throws it", "`throw` is used to throw an exception instance; `throws` declares in the method signature that the method may throw an exception", "There is no difference; they are interchangeable", "`throw` is for checked exceptions; `throws` is for unchecked exceptions"], correct: 1, explanation: "`throw` is a statement that actually throws an exception instance at runtime (e.g., `throw new IOException(...)`). `throws` is a clause in the method signature that declares which checked exceptions the method may propagate, so callers must handle or declare them." },
    { topic: "Exception Handling", question: "A developer writes:\n```java\ntry (BufferedReader br = new BufferedReader(new FileReader(\"file.txt\"))) {\n    System.out.println(br.readLine());\n} catch (IOException e) {\n    e.printStackTrace();\n}\n```\nWhat is the purpose of try-with-resources in this code?", options: ["It automatically closes resources that implement `AutoCloseable` when the block exits, even if an exception occurs", "It catches all exceptions and suppresses them", "It improves memory allocation for the BufferedReader", "It creates new resources for each iteration"], correct: 0, explanation: "Resources declared in the parentheses of try-with-resources are automatically closed when the block exits, whether normally or via an exception. The resource must implement AutoCloseable (or Closeable). This replaces the verbose finally block for closing resources." },
    { topic: "Exception Handling", question: "A developer writes a custom exception:\n```java\nclass AppException extends Exception {\n    AppException(String msg) { super(msg); }\n}\n```\nWhich statement is true about `AppException`?", options: ["It is an unchecked exception because it extends Exception", "It is a checked exception because it extends Exception (not RuntimeException); callers must catch or declare it", "It cannot be thrown because it has no default constructor", "It can only be used with try-with-resources"], correct: 1, explanation: "Any subclass of Exception that does NOT extend RuntimeException is a checked exception. Callers must either catch AppException or declare it with `throws`. To make it unchecked, it would need to extend RuntimeException. Custom checked exceptions are useful for recoverable business errors that callers should explicitly handle." },
    { topic: "Exception Handling", question: "A developer writes:\n```java\ntry {\n    riskyOperation();\n} catch (IOException | SQLException e) {\n    log.error(\"Failed\", e);\n}\n```\nWhat does the `|` symbol in the catch clause represent?", options: ["It catches both exceptions in two separate catch blocks", "It is the Java 7+ multi-catch syntax: one handler catches either exception type, and the caught variable is implicitly final", "It catches the first exception and ignores the second", "It is invalid syntax; Java requires separate catch blocks"], correct: 1, explanation: "The `|` symbol is Java 7+ multi-catch syntax. One catch block handles multiple unrelated exception types, reducing duplication. The caught variable `e` is implicitly final, so you cannot reassign it inside the block. This is different from catching a common superclass — multi-catch lets you handle unrelated exceptions (IOException and SQLException have no useful common subtype) in one place." },

    // ===== CONCURRENCY (5) =====
    { topic: "Concurrency", question: "What does the `synchronized` keyword do?", options: ["Makes a variable volatile", "Allows only one thread to execute a synchronized block/method at a time", "Prevents deadlocks", "Increases performance"], correct: 1, explanation: "It enforces mutual exclusion on the block or method." },
    { topic: "Concurrency", question: "What is the purpose of the `volatile` keyword?", options: ["Makes operations atomic", "Ensures changes to a variable are visible to all threads", "Prevents thread execution", "Makes a method synchronized"], correct: 1, explanation: "`volatile` guarantees visibility of writes across threads, but not atomicity." },
    { topic: "Concurrency", question: "Which of the following is a thread-safe collection?", options: ["ArrayList", "HashSet", "CopyOnWriteArrayList", "LinkedList"], correct: 2, explanation: "`CopyOnWriteArrayList` copies its internal array on every write, making it thread-safe for read-heavy use." },
    { topic: "Concurrency", question: "A developer needs to run many short-lived tasks asynchronously. What is the main advantage of using ExecutorService over creating a new Thread for each task?", options: ["ExecutorService guarantees tasks run in parallel on multiple CPUs", "ExecutorService reuses a pool of threads and queues tasks, avoiding the overhead of creating and destroying a thread per task", "ExecutorService automatically retries failed tasks and handles their exceptions", "ExecutorService makes all shared variables thread-safe automatically"], correct: 1, explanation: "ExecutorService manages a pool of worker threads. Instead of paying the cost of creating and destroying a thread for every task, tasks are submitted to a queue and executed by reusable threads. This improves throughput and bounds resource usage (you control the pool size).\n\nWhy others are wrong:\n- Option A: The JVM/OS decides parallelism; a single-thread executor runs tasks sequentially.\n- Option C: ExecutorService does not retry failed tasks. Exceptions from submit() are captured in the Future.\n- Option D: Thread safety of shared state is still the developer's responsibility." },
    { topic: "Concurrency", question: "A developer needs a shared counter incremented by multiple threads. Which approach is correct and thread-safe?", options: ["Use `int count` with `count++` in each thread", "Use `AtomicInteger` with `incrementAndGet()`", "Use `volatile int count` with `count++`", "Use a plain `static int` and hope for the best"], correct: 1, explanation: "`AtomicInteger.incrementAndGet()` performs a lock-free, atomic compare-and-swap (CAS) operation, so concurrent increments never lose updates.\n\nWhy others are wrong:\n- Option A: `count++` is not atomic — it is read, modify, write, and concurrent threads can interleave, losing increments.\n- Option C: `volatile` guarantees visibility but NOT atomicity. `count++` on a volatile is still a race condition.\n- Option D: A plain static int has both visibility and atomicity problems." },

    // ===== JAVA 8 & FUNCTIONAL (5) =====
    { topic: "Java 8 & Functional", question: "What is a lambda expression?", options: ["An anonymous class with a constructor", "A concise way to represent an instance of a functional interface", "A new primitive type", "A type of loop"], correct: 1, explanation: "Lambdas provide a compact syntax for implementing functional interfaces." },
    { topic: "Java 8 & Functional", question: "Which method in the Stream API is a terminal operation?", options: ["filter", "map", "sorted", "forEach"], correct: 3, explanation: "forEach consumes the stream and produces a result/side-effect; filter, map, sorted are intermediate (lazy)." },
    { topic: "Java 8 & Functional", question: "What is a Java record?", options: ["A mutable data class", "A class that automatically generates constructor, equals(), hashCode(), and toString() for data carriers", "A type of interface", "A database row object"], correct: 1, explanation: "Records (Java 16+) are concise immutable data carrier classes." },
    { topic: "Java 8 & Functional", question: "What is the primary purpose of the Optional class introduced in Java 8?", options: ["To replace null with an empty string", "To represent a value that may or may not be present, forcing callers to handle the absent case explicitly", "To make fields immutable", "To improve performance of null checks"], correct: 1, explanation: "`Optional<T>` is a container that either holds a value or is empty. It documents in the method signature that a return value may be missing and provides methods like `orElse()`, `orElseThrow()`, `ifPresent()`, and `map()` to handle both cases without explicit null checks. It is primarily intended for return types, not fields or parameters." },
    { topic: "Java 8 & Functional", question: "Which of the following correctly matches the four core functional interfaces to their abstract methods?", options: ["Function → apply(), Consumer → accept(), Supplier → get(), Predicate → test()", "Function → test(), Consumer → get(), Supplier → apply(), Predicate → accept()", "Function → accept(), Consumer → apply(), Supplier → test(), Predicate → get()", "Function → get(), Consumer → test(), Supplier → accept(), Predicate → apply()"], correct: 0, explanation: "The four core functional interfaces in `java.util.function` are:\n- Function<T,R>: `R apply(T t)` — takes one argument, returns a value.\n- Consumer<T>: `void accept(T t)` — takes one argument, returns nothing.\n- Supplier<T>: `T get()` — takes no arguments, returns a value.\n- Predicate<T>: `boolean test(T t)` — takes one argument, returns a boolean.\n\nMnemonic: Function transforms, Consumer consumes, Supplier supplies, Predicate tests." },

    // ===== FILE HANDLING (5) =====
    { topic: "File Handling", question: "Which class is best for reading a large text file line by line efficiently?", options: ["FileReader", "BufferedReader", "FileInputStream", "Scanner"], correct: 1, explanation: "BufferedReader buffers input, reducing costly I/O calls compared to reading char-by-char." },
    { topic: "File Handling", question: "Which Java NIO method reads all lines from a file into a `List<String>`?", options: ["Files.readAllLines(Path)", "Files.readFile(Path)", "Files.getLines(Path)", "Files.read(Path)"], correct: 0, explanation: "Files.readAllLines(Path) reads every line of a file into a `List<String>`." },
    { topic: "File Handling", question: "What exception is typically thrown when trying to open a non-existent file using FileInputStream?", options: ["IOException", "FileNotFoundException", "NoSuchFileException", "RuntimeException"], correct: 1, explanation: "FileNotFoundException (a subclass of IOException) is thrown specifically when the target file doesn't exist." },
    { topic: "File Handling", question: "Which interface must a class implement to allow its objects to be serialized?", options: ["Cloneable", "Serializable", "Externalizable", "Comparable"], correct: 1, explanation: "Implementing Serializable (a marker interface) enables an object to be converted to a byte stream." },
    { topic: "File Handling", question: "A developer needs to write a `String` to a file in a single call using `Java NIO.2`. Which method is correct?", options: ["`Files.writeString(Path, CharSequence, OpenOption...)`", "`Files.writeString(File, String)`", "`FileWriter.writeAll(String)`", "`Path.writeString(String)`"], correct: 0, explanation: "`Files.writeString(Path, CharSequence, OpenOption...)` (Java 11+) writes a `CharSequence` directly to a file in a single call, using UTF-8 by default. Example: `Files.writeString(path, \"hello\")`.\n\nBefore Java 11, use `Files.write(path, str.getBytes(StandardCharsets.UTF_8))`.\n\nWhy others are wrong:\n- `Files.writeString(File, String)` does not exist; the first parameter must be a `Path`, not a `File`.\n- `FileWriter.writeAll` does not exist; `FileWriter` only has `write(...)` methods and requires manual try-with-resources.\n- `Path.writeString` does not exist; `Path` is an interface representing a location, not a writer." },

    // ===== PERFORMANCE (5) =====
    { topic: "Performance", question: "Which of the following is the most efficient way to concatenate strings in a loop with many iterations?", options: ["String s = \"\"; for(...) { s += \"item\"; }", "StringBuilder sb = new StringBuilder(); for(...) { sb.append(\"item\"); } String s = sb.toString();", "StringBuffer sb = new StringBuffer(); for(...) { sb.append(\"item\"); } String s = sb.toString();", "String.concat(\"item\") inside the loop"], correct: 1, explanation: "StringBuilder avoids creating a new String object per iteration and isn't synchronized, unlike StringBuffer." },
    { topic: "Performance", question: "Which of the following can cause unnecessary performance overhead due to autoboxing?", options: ["Using primitive int in a loop", "Using Integer instead of int in a tight loop that performs many numeric operations", "Using StringBuilder for string concatenation", "Using ArrayList<int>"], correct: 1, explanation: "Repeated boxing/unboxing of Integer in tight loops adds overhead compared to primitive int." },
    { topic: "Performance", question: "What is the main performance problem with using String concatenation (+) inside a loop?", options: ["It causes NullPointerException", "It creates many intermediate immutable String objects", "It uses too much stack memory", "It cannot be compiled by the JIT"], correct: 1, explanation: "Each + creates a new immutable String object, wasting memory and CPU on garbage collection." },
    { topic: "Performance", question: "When should you prefer ArrayList over LinkedList for frequent random access and iteration?", options: ["Always, regardless of operations", "When you need fast insertion/deletion at the beginning", "When you need fast index-based access (get(index)) and iteration", "When you need to store a large number of null values"], correct: 2, explanation: "ArrayList gives O(1) index access; LinkedList requires O(n) traversal to reach an index." },
    { topic: "Performance", question: "For simple string concatenation (e.g., building a small message with a few variables), which is generally more efficient?", options: ["String.format(\"%s %s\", a, b)", "a + \" \" + b", "new StringBuilder().append(a).append(\" \").append(b).toString()", "String.concat(a).concat(b)"], correct: 1, explanation: "For a small, fixed number of concatenations, the compiler optimizes + into an efficient StringBuilder chain automatically — simpler and just as fast." },

    // ===== JVM & BYTECODE (10) =====
    { topic: "JVM & Bytecode", question: "Which component of the JVM is responsible for loading class files and verifying bytecode?", options: ["Garbage Collector", "Class Loader Subsystem", "Execution Engine", "JIT Compiler"], correct: 1, explanation: "The Class Loader Subsystem loads, links, and initializes classes. Bytecode verification happens during linking." },
    { topic: "JVM & Bytecode", question: "What is the purpose of the JIT (Just-In-Time) compiler?", options: ["To compile Java source code to bytecode", "To compile bytecode to native machine code at runtime for performance", "To interpret bytecode line by line", "To manage memory allocation"], correct: 1, explanation: "The JIT compiles hot bytecode paths into native machine code at runtime, improving performance over pure interpretation." },
    { topic: "JVM & Bytecode", question: "Which memory area in the JVM stores class-level variables, method code, and static data?", options: ["Heap", "Stack", "Method Area (Metaspace)", "Program Counter Register"], correct: 2, explanation: "The Method Area (Metaspace in modern JVMs) stores class metadata, static variables, and method bytecode." },
    { topic: "JVM & Bytecode", question: "What is the difference between the Heap and the Stack in Java?", options: ["Heap stores primitive values; Stack stores objects", "Heap is used for dynamic memory allocation (objects), Stack for method execution and local variables", "Heap is thread-safe, Stack is not", "Heap is faster than Stack"], correct: 1, explanation: "The Heap holds objects/arrays (GC-managed, shared across threads); the Stack holds per-thread frames for method calls and local variables." },
    { topic: "JVM & Bytecode", question: "Which JVM component performs garbage collection?", options: ["Class Loader", "Execution Engine", "Garbage Collector", "JIT Compiler"], correct: 2, explanation: "The Garbage Collector automatically reclaims memory occupied by objects that are no longer reachable." },
    { topic: "JVM & Bytecode", question: "What is bytecode in Java?", options: ["Machine code specific to the CPU", "The source code written by developers", "Platform-independent intermediate code executed by the JVM", "A type of Java compiler"], correct: 2, explanation: "Java source is compiled into .class bytecode files, which are platform-independent and run on any JVM." },
    { topic: "JVM & Bytecode", question: "Which JVM subsystem is primarily responsible for converting bytecode into native machine code?", options: ["Class Loader", "Interpreter", "JIT Compiler", "Garbage Collector"], correct: 2, explanation: "The Execution Engine has both an Interpreter and a JIT Compiler. The interpreter executes bytecode directly rather than converting it; the JIT Compiler is what actually compiles hot bytecode paths to native machine code." },
    { topic: "JVM & Bytecode", question: "Which of the following is NOT a standard JVM garbage collector?", options: ["Serial GC", "Parallel GC", "G1 GC", "ZGC", "Python GC"], correct: 4, explanation: "Python GC belongs to CPython, not the JVM. Serial, Parallel, G1, and ZGC are all real JVM garbage collectors." },
    { topic: "JVM & Bytecode", question: "What happens when the JVM runs out of heap memory?", options: ["It automatically increases the heap size beyond -Xmx", "It throws OutOfMemoryError", "It triggers garbage collection and always recovers enough memory", "It terminates without any error"], correct: 1, explanation: "If the heap is full and GC can't free enough space, the JVM throws java.lang.OutOfMemoryError." },
    { topic: "JVM & Bytecode", question: "What do the `-Xms` and `-Xmx` JVM flags control?", options: ["Thread stack size", "Initial and maximum heap size", "Garbage collector type", "Classpath"], correct: 1, explanation: "-Xms sets initial heap size, -Xmx sets the maximum heap size — key for performance tuning." },

    // ===== JAVA NETWORKING (5) =====
    { topic: "Java Networking", question: "A developer needs to read text data from a socket connection. Which combination correctly identifies:\n\n(1) The method to obtain the input stream from the remote host\n(2) The classes typically used to read character data efficiently over the socket", options: ["(1) socket.getInputStream()\n(2) BufferedReader / PrintWriter", "(1) socket.getInputStream()\n(2) DataInputStream / DataOutputStream", "(1) socket.read()\n(2) ObjectInputStream / ObjectOutputStream", "(1) socket.getInputStream()\n(2) Scanner / Formatter"], correct: 0, explanation: "(1) Use socket.getInputStream() to obtain an InputStream for reading data from the remote host. socket.read() does not exist.\n(2) For character/text protocols, wrap the streams in BufferedReader (reading) and PrintWriter (writing) for efficient line-based I/O.\n\nWhy others are wrong:\n- DataInputStream/DataOutputStream are for binary primitives (int, double, etc.), not text lines.\n- ObjectInputStream/ObjectOutputStream are for Java serialization, not raw text.\n- Scanner can read from an InputStream but is slower and not the idiomatic choice for socket line protocols; Formatter is for output formatting, not socket streams.\n\nOption A is the correct and most idiomatic answer." },
    { topic: "Java Networking", question: "A developer is designing a TCP server and needs to:\n\n(a) Choose the correct statement about TCP vs UDP\n(b) Implement a server that listens for incoming TCP client connections on a specific port\n\nWhich combination correctly implements both tasks?", options: ["(a) TCP is connection-oriented and reliable; UDP is connectionless and unreliable\n(b) ServerSocket", "(a) TCP is unreliable; UDP is reliable\n(b) Socket", "(a) TCP is faster than UDP\n(b) DatagramSocket", "(a) TCP uses packets; UDP uses streams\n(b) URL"], correct: 0, explanation: "(a) TCP is connection-oriented: it establishes a connection and guarantees delivery and order. UDP is connectionless: it sends independent datagrams with no delivery/order guarantee, which can be faster but unreliable.\n\n(b) ServerSocket is the server-side listening socket used to accept incoming TCP connections on a port. Socket is used after a connection is established (both client and server side). DatagramSocket is for UDP, and URL is for addressing resources, not listening.\n\nOnly Option A is correct." },
    { topic: "Java Networking", question: "A developer needs to implement connectionless UDP communication. Which combination correctly identifies the classes and their roles?", options: ["(1) DatagramSocket sends/receives packets\n(2) DatagramPacket encapsulates data, length, and destination address", "(1) ServerSocket sends/receives packets\n(2) Socket encapsulates data and address", "(1) DatagramSocket sends/receives packets\n(2) Socket encapsulates data and address", "(1) Socket sends/receives packets\n(2) DatagramPacket encapsulates data and address"], correct: 0, explanation: "UDP communication in Java uses two classes:\n- DatagramSocket: the endpoint that sends and receives datagrams. It is connectionless — no handshake, no guaranteed order/delivery.\n- DatagramPacket: encapsulates the payload (byte[]), its length, and the destination (or source) address + port.\n\nWhy others are wrong:\n- ServerSocket and Socket are TCP classes and cannot send UDP datagrams.\n- Mixing DatagramSocket with Socket is invalid: Socket does not encapsulate a UDP packet.\n\nOnly Option A correctly matches both classes to their roles." },
    { topic: "Java Networking", question: "A developer needs to perform the following tasks:\n(1) Represent an IP address to resolve a hostname\n(2) Open a connection to an HTTP URL and read data from it\n\nWhich combination correctly identifies the class/method to use?", options: ["(1) InetAddress.getByName(\"host\")\n(2) URLConnection (HttpURLConnection)", "(1) IPAddress.resolve(\"host\")\n(2) URL.openStream()", "(1) InetAddress.getLocalHost()\n(2) Socket.connect(url)", "(1) HostAddress.getByName(\"host\")\n(2) DatagramSocket.connect(url)"], correct: 0, explanation: "(1) InetAddress is the correct class to represent an IP address; use InetAddress.getByName() to resolve a hostname to its IP address.\n(2) URLConnection (specifically HttpURLConnection) is the standard way to open an HTTP connection; it allows setting request properties, reading response headers, etc.\n\nWhy others are wrong:\n- Option B: There is no class called `IPAddress` in Java (non-existent). `URL.openStream()` is a shortcut but not an instance of URLConnection; it lacks HTTP-specific controls.\n- Option C: `InetAddress.getLocalHost()` returns the local machine's address, not a remote host. `Socket.connect(url)` expects a `SocketAddress`, not a URL, and is for raw TCP, not HTTP.\n- Option D: `HostAddress` does not exist. `DatagramSocket` is for UDP, not HTTP.\n\nOnly Option A is correct." },
    { topic: "Java Networking", question: "A developer is writing a server-client application and needs to:\n\n(1) Set a read timeout on a Socket so that a read operation throws SocketTimeoutException if no data arrives within 5000 ms\n(2) Understand the behavior of ServerSocket.accept() when waiting for client connections\n\nWhich combination correctly implements these?", options: ["(1) socket.setSoTimeout(5000)\n(2) accept() blocks until a client connects, then returns a Socket", "(1) socket.setTimeout(5000)\n(2) accept() immediately returns null if no client is waiting", "(1) socket.setReadTimeout(5000)\n(2) accept() sends a SYN-ACK to the client", "(1) socket.setConnectTimeout(5000)\n(2) accept() closes the server socket"], correct: 0, explanation: "(1) setSoTimeout(int milliseconds) sets the read timeout; if no data arrives within that time, a SocketTimeoutException is thrown.\n- setTimeout, setReadTimeout, and setConnectTimeout are either non-existent on Socket or serve different purposes (setConnectTimeout exists on URLConnection, not Socket).\n\n(2) ServerSocket.accept() blocks the calling thread until a client connection is established; it then returns a new Socket for communication. It does not return null, does not send SYN-ACK itself (the OS/network stack does that during the TCP handshake), and does not close the server.\n\nOption A is correct." },

    // ===== SERVLET (5) =====
    { topic: "Servlet", question: "Which of the following correctly describes the lifecycle methods of a Servlet?", options: ["init() is called for every request, service() once at startup, destroy() at end of each request", "init() is called once at startup, service() is called for every request, destroy() is called once when the servlet is taken out of service", "service() is called once at startup, init() is called for every request, destroy() is called once when the servlet is taken out of service", "init() and destroy() are called for each request, service() only once"], correct: 1, explanation: "A servlet's lifecycle is: (1) the container calls init() exactly once when the servlet is first loaded; (2) service() is invoked for each client request, dispatching to doGet(), doPost(), etc.; (3) destroy() is called exactly once before the servlet is removed from service, allowing cleanup of resources." },
    { topic: "Servlet", question: "Which object(s) are used to maintain state at the following scopes: request, session, and application?", options: ["HttpSession for request, ServletContext for session, ServletConfig for application", "ServletRequest for request, HttpSession for session, ServletContext for application", "ServletConfig for request, HttpSession for session, ServletContext for application", "ServletRequest for request, ServletConfig for session, HttpSession for application"], correct: 1, explanation: "ServletRequest is request-scoped (data for a single request). HttpSession is session-scoped (data for a single user across multiple requests). ServletContext is application-scoped (shared by all users and servlets in the web app). ServletConfig is per-servlet configuration, not for state storage. In CDI, similar scopes exist using annotations like @RequestScoped, @SessionScoped, and @ApplicationScoped." },
    { topic: "Servlet", question: "Which method in a filter is invoked for each request, and how can you execute logic both before and after the servlet processes the request?", options: ["doFilter(); place code before chain.doFilter() and after chain.doFilter()", "filter(); place code before chain.forward() and after chain.forward()", "preProcess(); place code before chain.doFilter() only", "intercept(); place code after chain.doFilter() only"], correct: 0, explanation: "The Filter interface has init(), doFilter(), and destroy(). doFilter() is called for each request that passes through the filter. To run code before the servlet processes the request, write it before calling chain.doFilter(request, response). To run code after the servlet has produced its output, write it after the call returns. This is how filters can modify requests, responses, or perform logging, authentication, etc." },
    { topic: "Servlet", question: "A developer is building a Java web application. Which set of options correctly implements the following tasks?\n(1) Map a servlet to a URL without using web.xml\n(2) Forward a request to a JSP on the server\n(3) Retrieve a cookie from the client's request\n(4) Import Java classes in a JSP", options: ["@WebServlet(\"/path\") ; request.getRequestDispatcher(\"url\").forward(request, response) ; request.getCookies() ; <%@ page import=\"java.util.*\" %>", "@UrlMapping(\"/path\") ; response.sendRedirect(\"url\") ; response.getCookies() ; <%! import java.util.*; %>", "@WebServlet(\"/path\") ; response.forward(\"url\") ; session.getCookies() ; <%= import java.util.* %>", "@RequestMapping(\"/path\") ; request.redirect(\"url\") ; context.getCookies() ; <% import java.util.*; %>"], correct: 0, explanation: "1) Use @WebServlet(\"/path\") for annotation-based servlet mapping (Servlet 3.0+). 2) Use request.getRequestDispatcher(\"url\").forward(request, response) for server-side forwarding (no URL change). 3) Use request.getCookies() to retrieve client cookies. 4) Use <%@ page import=\"java.util.*\" %> directive to import classes in JSP. All other combinations contain incorrect methods or syntax." },
