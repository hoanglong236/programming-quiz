<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Programming Quiz</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-accent: #2563eb;
    --text-success: #15803d;
    --text-danger: #b91c1c;
    --on-accent: #ffffff;

    --surface-0: #ffffff;
    --surface-1: #f0f0f0;
    --bg-accent-muted: #eff6ff;
    --bg-success: #f0fdf4;
    --bg-danger: #fef2f2;

    --fill-accent: #2563eb;

    --border: #d4d4d4;
    --border-strong: #a3a3a3;
    --border-accent: #2563eb;
    --border-success: #22c55e;
    --border-danger: #ef4444;

    --radius: 8px;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  button:disabled {
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div id="quiz-container" style="max-width: 700px; margin: 0 auto; padding: 2rem;">
  <!-- Topic selector -->
  <div style="margin-bottom: 1.5rem;">
    <label for="topic-select" style="font-size: 14px; color: var(--text-secondary); margin-right: 8px;">Topic:</label>
    <select id="topic-select" onchange="switchTopic(this.value)"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background-color: var(--surface-0);">
      <option value="Java" selected>Java</option>
      <option value="C#">C#</option>
      <option value="PHP">PHP</option>
      <option value="Database">Database</option>
      <option value="Cloud">Cloud</option>
      <option value="Web">Web</option>
      <option value="CAndCPP">C/C++</option>
    </select>
  </div>

  <div style="margin-bottom: 1.5rem; display: flex; gap: 8px;">
    <button onclick="exportProgress()"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Export progress
    </button>

    <button onclick="document.getElementById('import-file').click()"
      style="padding: 8px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Import progress
    </button>

    <input type="file" id="import-file" accept="application/json" style="display:none"
      onchange="importProgress(event)" />
  </div>

  <div id="progress-section" style="margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 500;" id="question-number">Question 1 of 50</h2>
      <div style="font-size: 14px; color: var(--text-secondary);" id="score-display">Score: 0/0</div>
    </div>
    <div style="width: 100%; height: 4px; background-color: var(--surface-1); border-radius: 2px; overflow: hidden;">
      <div id="progress-bar"
        style="width: 2%; height: 100%; background-color: var(--fill-accent); transition: width 0.3s;"></div>
    </div>
  </div>

  <div id="jump-buttons"
    style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 1.5rem; max-height: 100px; overflow-y: auto;"></div>

  <div id="question-section" style="margin-bottom: 1.5rem;">
    <div id="topic-tag"
      style="display: inline-block; font-size: 12px; color: var(--text-accent); background-color: var(--bg-accent-muted); padding: 4px 8px; border-radius: var(--radius); margin-bottom: 1rem;">
    </div>
    <h3 id="question-text"
      style="font-size: 16px; font-weight: 500; margin: 1rem 0; white-space: pre-wrap; font-family: var(--font-mono); line-height: 1.5;">
    </h3>
  </div>

  <div id="options-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem;"></div>

  <div id="feedback-section"
    style="display: none; padding: 12px; border-radius: var(--radius); margin-bottom: 2rem; font-size: 14px; line-height: 1.6;">
    <div id="feedback-status" style="font-weight: 500; margin-bottom: 6px;"></div>
    <div id="feedback-text" style="font-size: 13px;"></div>

    <button id="clear-answer-btn" onclick="clearAnswer()"
      style="margin-top: 10px; padding: 6px 14px; font-size: 13px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">
      Clear answer
    </button>
  </div>

  <div style="display: flex; gap: 8px; justify-content: space-between; margin-top: 1rem;">
    <button id="prev-btn" onclick="goToPrevious()"
      style="padding: 8px 16px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">←
      Previous</button>
    <button id="submit-btn" onclick="submitAnswer()"
      style="padding: 8px 24px; font-size: 14px; border: none; background-color: var(--fill-accent); color: var(--on-accent); border-radius: var(--radius); cursor: pointer; font-weight: 500;">Check
      answer</button>
  </div>

  <div id="complete-section"
    style="display: none; margin-top: 2rem; padding: 16px; background-color: var(--surface-1); border-radius: 12px; text-align: center;">
    <div style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">Quiz complete</div>
    <div id="final-score" style="font-size: 32px; font-weight: 500; color: var(--fill-accent); margin-bottom: 1rem;">
    </div>
    <button onclick="resetQuiz()"
      style="padding: 8px 24px; font-size: 14px; border: 0.5px solid var(--border-strong); background-color: transparent; border-radius: var(--radius); cursor: pointer;">Restart
      quiz</button>
  </div>
</div>

<script>
  // ========== JAVA QUESTIONS ==========
  const javaQuestions = [
    { topic: "Core Java", question: "Which of the following is a valid `main` method declaration?", options: ["public static void main(String args)", "public static void main(String[] args)", "public void main(String[] args)", "static void main(String args[])"], correct: 1, explanation: "Must be public, static, return void, and accept a String array." },
    { topic: "Core Java", question: "Which of the following is not a primitive type?", options: ["int", "boolean", "String", "char"], correct: 2, explanation: "String is a class (reference type), not a primitive." },
    { topic: "Core Java", question: "What does System.out.println(1 + 2 + \"3\"); print?", options: ["33", "123", "6", "15"], correct: 0, explanation: "1+2 evaluates first (int addition) = 3, then 3 + \"3\" becomes string concatenation = \"33\"." },
    { topic: "Core Java", question: "Which keyword prevents a class from being subclassed?", options: ["final", "static", "abstract", "private"], correct: 0, explanation: "`final` on a class prevents inheritance." },
    { topic: "Core Java", question: "What is autoboxing?", options: ["Converting a wrapper object to a primitive", "Converting a primitive to its corresponding wrapper object automatically", "Converting a String to int", "Creating an array"], correct: 1, explanation: "Autoboxing automatically converts primitives (e.g. int) into their wrapper class (Integer)." },

    { topic: "OOP & Inheritance", question: "Which class is the root of all Java classes?", options: ["Object", "Class", "Main", "Root"], correct: 0, explanation: "Every class implicitly extends Object." },
    { topic: "OOP & Inheritance", question: "Which of the following allows a class to have multiple inheritance of type in Java?", options: ["Extending multiple classes", "Implementing multiple interfaces", "Using `super` keyword", "Java does not support multiple inheritance of any kind"], correct: 1, explanation: "Java allows implementing multiple interfaces, giving multiple inheritance of type (not implementation)." },
    { topic: "OOP & Inheritance", question: "Which statement about `String` is true?", options: ["String is mutable", "String is immutable", "String can be changed with `append()`", "String is a primitive type"], correct: 1, explanation: "Strings are immutable in Java; `append()` belongs to StringBuilder." },
    { topic: "OOP & Inheritance", question: "Which method is used to compare two strings for content equality?", options: ["==", "equals()", "compareTo()", "hashCode()"], correct: 1, explanation: "`equals()` compares content; `==` compares references." },
    { topic: "OOP & Inheritance", question: "Which annotation indicates a method is intended to override a superclass method?", options: ["@Override", "@Overload", "@Inherit", "@Super"], correct: 0, explanation: "`@Override` triggers a compiler check that the method actually overrides a superclass method." },

    { topic: "Collections", question: "Which collection is backed by a resizable array?", options: ["LinkedList", "ArrayList", "HashSet", "TreeMap"], correct: 1, explanation: "ArrayList is backed internally by a dynamically resizing array." },
    { topic: "Collections", question: "Which `Map` implementation maintains keys in sorted order?", options: ["HashMap", "Hashtable", "TreeMap", "LinkedHashMap"], correct: 2, explanation: "TreeMap sorts keys by natural order or a Comparator." },
    { topic: "Collections", question: "What is the default load factor of a `HashMap`?", options: ["0.5", "0.75", "1.0", "0.25"], correct: 1, explanation: "Default load factor is 0.75, balancing space and time cost." },
    { topic: "Collections", question: "What happens if two objects have the same hash code but are not equal in a `HashMap`?", options: ["One overwrites the other", "They are stored in the same bucket", "An exception is thrown", "They cannot be added"], correct: 1, explanation: "Objects with equal hash codes land in the same bucket and are differentiated by equals()." },
    { topic: "Collections", question: "Which collection preserves insertion order?", options: ["HashSet", "HashMap", "LinkedHashSet", "TreeSet"], correct: 2, explanation: "LinkedHashSet maintains a linked list running through its entries, preserving insertion order." },
    { topic: "Collections", question: "Which statement about HashMap and Hashtable is correct?", options: ["HashMap is synchronized, Hashtable is not", "Hashtable allows null keys and values, HashMap does not", "HashMap is not synchronized and allows null keys/values; Hashtable is synchronized and disallows null keys/values", "Both are synchronized and disallow null keys/values"], correct: 2, explanation: "HashMap is not thread-safe and permits one null key and multiple null values. Hashtable is synchronized and throws NullPointerException on null keys/values." },
    { topic: "Collections", question: "Which interface must a class implement to define its natural ordering for use in a TreeSet or TreeMap?", options: ["Comparator", "Comparable", "Iterable", "Serializable"], correct: 1, explanation: "Comparable's compareTo() defines natural ordering. Comparator provides external custom ordering and does not require the class itself to implement it." },

    { topic: "Exception Handling", question: "Which of the following is a checked exception?", options: ["NullPointerException", "IllegalArgumentException", "IOException", "ArithmeticException"], correct: 2, explanation: "IOException must be caught or declared; the others are unchecked RuntimeExceptions." },
    { topic: "Exception Handling", question: "What is the difference between `throw` and `throws`?", options: ["`throw` declares an exception; `throws` throws it", "`throw` is used to throw an exception; `throws` declares that a method may throw an exception", "There is no difference", "`throw` is checked; `throws` is unchecked"], correct: 1, explanation: "`throw` actually throws an instance; `throws` is a method signature declaration." },
    { topic: "Exception Handling", question: "What is the purpose of try-with-resources?", options: ["Automatically closes resources that implement `AutoCloseable`", "Catches all exceptions", "Improves memory allocation", "Creates new resources"], correct: 0, explanation: "Resources declared in the parentheses are automatically closed when the block exits." },
    { topic: "Exception Handling", question: "Which of the following is an unchecked exception?", options: ["SQLException", "IOException", "NullPointerException", "ClassNotFoundException"], correct: 2, explanation: "NullPointerException extends RuntimeException, making it unchecked." },

    { topic: "Concurrency", question: "Which method must be implemented when implementing `Runnable`?", options: ["start()", "run()", "call()", "execute()"], correct: 1, explanation: "Runnable's single abstract method is run()." },
    { topic: "Concurrency", question: "What does the `synchronized` keyword do?", options: ["Makes a variable volatile", "Allows only one thread to execute a synchronized block/method at a time", "Prevents deadlocks", "Increases performance"], correct: 1, explanation: "It enforces mutual exclusion on the block or method." },
    { topic: "Concurrency", question: "What is the purpose of the `volatile` keyword?", options: ["Makes operations atomic", "Ensures changes to a variable are visible to all threads", "Prevents thread execution", "Makes a method synchronized"], correct: 1, explanation: "`volatile` guarantees visibility of writes across threads, but not atomicity." },
    { topic: "Concurrency", question: "Which of the following is a thread-safe collection?", options: ["ArrayList", "HashSet", "CopyOnWriteArrayList", "LinkedList"], correct: 2, explanation: "CopyOnWriteArrayList copies its internal array on every write, making it thread-safe for read-heavy use." },

    { topic: "Java 8 & Functional", question: "What is a lambda expression?", options: ["An anonymous class with a constructor", "A concise way to represent an instance of a functional interface", "A new primitive type", "A type of loop"], correct: 1, explanation: "Lambdas provide a compact syntax for implementing functional interfaces." },
    { topic: "Java 8 & Functional", question: "Which functional interface accepts one argument and returns a `boolean`?", options: ["Consumer", "Supplier", "Predicate", "Function"], correct: 2, explanation: "Predicate<T> has a test(T) method returning boolean." },
    { topic: "Java 8 & Functional", question: "Which functional interface accepts no arguments and returns a value?", options: ["Consumer", "Supplier", "Predicate", "Function"], correct: 1, explanation: "Supplier<T> has a get() method with no arguments." },
    { topic: "Java 8 & Functional", question: "Which method in the Stream API is a terminal operation?", options: ["filter", "map", "sorted", "forEach"], correct: 3, explanation: "forEach consumes the stream and produces a result/side-effect; filter, map, sorted are intermediate (lazy)." },
    { topic: "Java 8 & Functional", question: "What is a Java record?", options: ["A mutable data class", "A class that automatically generates constructor, equals(), hashCode(), and toString() for data carriers", "A type of interface", "A database row object"], correct: 1, explanation: "Records (Java 16+) are concise immutable data carrier classes." },

    { topic: "File Handling", question: "Which class is best for reading a large text file line by line efficiently?", options: ["FileReader", "BufferedReader", "FileInputStream", "Scanner"], correct: 1, explanation: "BufferedReader buffers input, reducing costly I/O calls compared to reading char-by-char." },
    { topic: "File Handling", question: "Which Java NIO method reads all lines from a file into a List<String>?", options: ["Files.readAllLines(Path)", "Files.readFile(Path)", "Files.getLines(Path)", "Files.read(Path)"], correct: 0, explanation: "Files.readAllLines(Path) reads every line of a file into a List<String>." },
    { topic: "File Handling", question: "What exception is typically thrown when trying to open a non-existent file using FileInputStream?", options: ["IOException", "FileNotFoundException", "NoSuchFileException", "RuntimeException"], correct: 1, explanation: "FileNotFoundException (a subclass of IOException) is thrown specifically when the target file doesn't exist." },
    { topic: "File Handling", question: "Which interface must a class implement to allow its objects to be serialized?", options: ["Cloneable", "Serializable", "Externalizable", "Comparable"], correct: 1, explanation: "Implementing Serializable (a marker interface) enables an object to be converted to a byte stream." },
    { topic: "File Handling", question: "Which Java feature ensures that file streams are automatically closed after use?", options: ["try-catch only", "try-with-resources", "finally only", "synchronized block"], correct: 1, explanation: "try-with-resources auto-closes any AutoCloseable resource, like file streams, even if an exception occurs." },

    { topic: "Coding & OOP Calc", question: "What is the output?\nclass Test {\n    static int count = 0;\n    Test() { count++; }\n    public static void main(String[] args) {\n        new Test(); new Test(); new Test();\n        System.out.println(count);\n    }\n}", options: ["0", "1", "2", "3"], correct: 3, explanation: "Each constructor call increments the shared static counter. Three instances = 3." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass A { int x = 5; }\nclass B extends A {\n    int x = 10;\n    void print() { System.out.println(super.x + \" \" + x); }\n}\nnew B().print();", options: ["10 10", "5 10", "10 5", "5 5"], correct: 1, explanation: "Fields are not polymorphic. super.x accesses A's x (5); x accesses B's x (10)." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nabstract class Shape { abstract double area(); }\nclass Circle extends Shape {\n    double radius;\n    Circle(double radius) { this.radius = radius; }\n    double area() { return Math.PI * radius * radius; }\n}\nSystem.out.printf(\"%.2f\", new Circle(1).area());", options: ["3.14", "3.14159", "1.00", "6.28"], correct: 0, explanation: "Area = π × 1² ≈ 3.14159..., formatted to 2 decimals = 3.14." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass A {\n    void print() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    void print() { System.out.println(\"B\"); }\n}\nA obj = new B();\nobj.print();", options: ["A", "B", "Compilation error", "Runtime error"], correct: 1, explanation: "Method overriding uses dynamic dispatch based on the actual object type, B." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass Parent {\n    Parent() { System.out.print(\"P\"); }\n}\nclass Child extends Parent {\n    Child() { System.out.print(\"C\"); }\n}\nnew Child();", options: ["PC", "CP", "P", "C"], correct: 0, explanation: "A subclass constructor implicitly calls super() first, so Parent's constructor runs before Child's: \"PC\"." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass Test {\n    void m(int x) { System.out.print(\"int \"); }\n    void m(Integer x) { System.out.print(\"Integer \"); }\n    public static void main(String[] args) {\n        new Test().m(5);\n    }\n}", options: ["int", "Integer", "Compilation error", "Runtime error"], correct: 0, explanation: "The compiler prefers an exact primitive match (int) over autoboxing to Integer." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass A { int x = 10; }\nclass B extends A { int x = 20; }\nA a = new B();\nSystem.out.println(a.x);", options: ["10", "20", "Compilation error", "Runtime error"], correct: 0, explanation: "Fields are resolved statically by the declared type (A), not the runtime type. So a.x = 10." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass A {\n    static void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    static void m() { System.out.println(\"B\"); }\n}\nA a = new B();\na.m();", options: ["A", "B", "Compilation error", "Runtime error"], correct: 0, explanation: "Static methods are not polymorphic — they're resolved at compile time based on the reference type (A), so \"A\" prints." },
    { topic: "Coding & OOP Calc", question: "What is the output?\nclass A { int getValue() { return 10; } }\nclass B extends A { int getValue() { return 20; } }\nclass C extends B { int getValue() { return super.getValue() + 5; } }\nSystem.out.println(new C().getValue());", options: ["10", "20", "25", "35"], correct: 2, explanation: "C.getValue() calls super.getValue() → B.getValue() returns 20, plus 5 = 25." },
    { topic: "Coding & OOP Calc", question: "What happens if class B tries to override a final method from class A?\nclass A {\n    final void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    // attempting to override m()\n}", options: ["It works normally", "Compilation error", "Runtime error", "The method is hidden"], correct: 1, explanation: "A final method cannot be overridden by a subclass. Attempting to do so is a compile-time error." },

    { topic: "Performance", question: "Which of the following is the most efficient way to concatenate strings in a loop with many iterations?", options: ["String s = \"\"; for(...) { s += \"item\"; }", "StringBuilder sb = new StringBuilder(); for(...) { sb.append(\"item\"); } String s = sb.toString();", "StringBuffer sb = new StringBuffer(); for(...) { sb.append(\"item\"); } String s = sb.toString();", "String.concat(\"item\") inside the loop"], correct: 1, explanation: "StringBuilder avoids creating a new String object per iteration and isn't synchronized, unlike StringBuffer." },
    { topic: "Performance", question: "Which of the following can cause unnecessary performance overhead due to autoboxing?", options: ["Using primitive int in a loop", "Using Integer instead of int in a tight loop that performs many numeric operations", "Using StringBuilder for string concatenation", "Using ArrayList<int>"], correct: 1, explanation: "Repeated boxing/unboxing of Integer in tight loops adds overhead compared to primitive int." },
    { topic: "Performance", question: "What is the main performance problem with using String concatenation (+) inside a loop?", options: ["It causes NullPointerException", "It creates many intermediate immutable String objects", "It uses too much stack memory", "It cannot be compiled by the JIT"], correct: 1, explanation: "Each + creates a new immutable String object, wasting memory and CPU on garbage collection." },
    { topic: "Performance", question: "When should you prefer ArrayList over LinkedList for frequent random access and iteration?", options: ["Always, regardless of operations", "When you need fast insertion/deletion at the beginning", "When you need fast index-based access (get(index)) and iteration", "When you need to store a large number of null values"], correct: 2, explanation: "ArrayList gives O(1) index access; LinkedList requires O(n) traversal to reach an index." },
    { topic: "Performance", question: "For simple string concatenation (e.g., building a small message with a few variables), which is generally more efficient?", options: ["String.format(\"%s %s\", a, b)", "a + \" \" + b", "new StringBuilder().append(a).append(\" \").append(b).toString()", "String.concat(a).concat(b)"], correct: 1, explanation: "For a small, fixed number of concatenations, the compiler optimizes + into an efficient StringBuilder chain automatically — simpler and just as fast." },

    { topic: "Additional Coding", question: "What is the output?\nString s = \"Hello\";\ns.concat(\" World\");\nSystem.out.println(s);", options: ["Hello World", "Hello", "World", "Compilation error"], correct: 1, explanation: "String is immutable; concat() returns a new String that's discarded here, so s stays \"Hello\"." },
    { topic: "Additional Coding", question: "What is the output?\nboolean b = false;\nif (b = true) {\n    System.out.println(\"Yes\");\n} else {\n    System.out.println(\"No\");\n}", options: ["Yes", "No", "Compilation error", "Runtime error"], correct: 0, explanation: "This is assignment (=), not comparison (==). b is set to true, so the if-branch runs, printing \"Yes\"." },
    { topic: "Additional Coding", question: "What is the output?\nint x = 5;\nint y = x++ + ++x;\nSystem.out.println(y);", options: ["10", "11", "12", "13"], correct: 2, explanation: "x++ uses 5 then increments x to 6. ++x increments x to 7 then uses 7. y = 5 + 7 = 12." },
    { topic: "Additional Coding", question: "What is the output?\nint[] arr = {1,2,3,4,5};\nfor(int i=0; i<arr.length; i++) {\n    if(i==2) continue;\n    System.out.print(arr[i]);\n}", options: ["12345", "1245", "1345", "124"], correct: 1, explanation: "continue skips only index 2 (value 3), printing arr[0],arr[1],arr[3],arr[4] = 1,2,4,5." },
    { topic: "Additional Coding", question: "What is the output?\nint a = 10, b = 20;\na = a + b;\nb = a - b;\na = a - b;\nSystem.out.println(a + \" \" + b);", options: ["10 20", "20 10", "30 10", "10 30"], correct: 1, explanation: "This is the classic swap trick: a becomes 30, then b = 30-20 = 10, then a = 30-10 = 20. Result: a=20, b=10." },
    { topic: "Additional Coding", question: "What is the output?\nint i = 0;\nwhile(i < 3) {\n    System.out.print(i);\n    i++;\n}", options: ["012", "123", "01", "Infinite loop"], correct: 0, explanation: "The loop prints i then increments, running while i<3: prints 0, 1, 2." },
    { topic: "Additional Coding", question: "What is the output?\nfor(int i=0; i<5; i++) {\n    if(i==3) break;\n    System.out.print(i);\n}", options: ["0123", "012", "0124", "1234"], correct: 1, explanation: "break exits the loop entirely once i==3, so only 0, 1, 2 print." },
    { topic: "Additional Coding", question: "What is the output?\nint x = 1;\nswitch(x) {\n    case 1: System.out.print(\"one\");\n    case 2: System.out.print(\"two\");\n    case 3: System.out.print(\"three\");\n}", options: ["one", "onetwothree", "one two three", "Compilation error"], correct: 1, explanation: "No break statements means execution falls through all matching and subsequent cases: \"onetwothree\"." },
    { topic: "Additional Coding", question: "What is the output?\nSystem.out.println(10 % 3);", options: ["1", "3", "0", "1.0"], correct: 0, explanation: "The modulo operator returns the remainder of 10÷3, which is 1." },
    { topic: "Additional Coding", question: "What is the output?\nString str = null;\nSystem.out.println(str.length());", options: ["0", "null", "NullPointerException", "Compilation error"], correct: 2, explanation: "Calling a method on a null reference throws NullPointerException at runtime." },

    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    int x = 5;\n    void print() { System.out.println(this.x); }\n}\nclass B extends A {\n    int x = 10;\n    void print() {\n        super.print();\n        System.out.println(x);\n    }\n}\nnew B().print();", options: ["5 then 5", "10 then 10", "5 then 10", "10 then 5"], correct: 2, explanation: "super.print() runs A's print(), where this.x resolves to A's field (5) since fields aren't polymorphic. Then B's print() prints its own x (10)." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass Parent {\n    int x = 5;\n    Parent() { print(); }\n    void print() { System.out.println(x); }\n}\nclass Child extends Parent {\n    int x = 10;\n    void print() { System.out.println(x); }\n}\nnew Child();", options: ["5", "10", "0", "Compilation error"], correct: 2, explanation: "Parent's constructor calls print(), which is overridden by Child — but Child's x field hasn't been initialized yet at that point, so it's still the default value 0." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    int x = 1;\n    void print() { System.out.println(x); }\n}\nclass B extends A {\n    int x = 2;\n    void print() { System.out.println(x); }\n}\nA a = new B();\na.print();\nSystem.out.println(a.x);", options: ["2 then 2", "1 then 1", "2 then 1", "1 then 2"], correct: 2, explanation: "print() is overridden (dynamic dispatch → B's x = 2). But a.x is field access resolved by declared type A → 1." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A { static int x = 5; }\nclass B extends A { static int x = 10; }\nA a = new B();\nSystem.out.println(a.x);", options: ["5", "10", "0", "Compilation error"], correct: 0, explanation: "Static fields, like instance fields, are resolved by the declared reference type (A), not the runtime type. a.x = 5." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    int x = 5;\n    void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    int x = 10;\n    void m() { System.out.println(\"B\"); }\n}\nA a = new B();\nSystem.out.println(a.x);\na.m();", options: ["5 then A", "10 then B", "5 then B", "10 then A"], correct: 2, explanation: "Field access a.x uses the declared type A → 5. Method call a.m() uses dynamic dispatch → B's m() prints \"B\"." },
    { topic: "Additional OOP Calc", question: "What is the output?\nabstract class Animal { abstract void sound(); }\nclass Dog extends Animal {\n    void sound() { System.out.println(\"Bark\"); }\n}\nAnimal a = new Dog();\na.sound();", options: ["Bark", "No output", "Compilation error", "Runtime error"], correct: 0, explanation: "Dog provides a concrete implementation of the abstract sound() method, so calling it prints \"Bark\"." },
    { topic: "Additional OOP Calc", question: "What is the output?\ninterface I { int x = 10; }\nclass C implements I {\n    void print() { System.out.println(x); }\n}\nnew C().print();", options: ["10", "0", "Compilation error", "Runtime error"], correct: 0, explanation: "Interface fields are implicitly public static final. C inherits the constant x = 10 and can access it directly." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    static void m() { System.out.println(\"A\"); }\n}\nclass B extends A {\n    static void m() { System.out.println(\"B\"); }\n}\nA a = new B();\na.m();\nB b = new B();\nb.m();", options: ["A then A", "B then B", "A then B", "B then A"], correct: 2, explanation: "Static methods are resolved by declared reference type at compile time. a (type A) prints \"A\"; b (type B) prints \"B\"." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    A() { System.out.println(\"A constructor\"); }\n}\nclass B extends A {\n    B() {\n        this(5);\n        System.out.println(\"B constructor\");\n    }\n    B(int x) { System.out.println(\"B int constructor\"); }\n}\nnew B();", options: ["A constructor, B int constructor, B constructor", "A constructor, B constructor", "B int constructor, A constructor, B constructor", "Compilation error"], correct: 0, explanation: "new B() calls B(), which calls this(5) → B(int). B(int) implicitly calls super() first, printing \"A constructor\", then \"B int constructor\", then control returns to B() which prints \"B constructor\"." },
    { topic: "Additional OOP Calc", question: "What is the output?\nclass A {\n    int x = 5;\n    void print() { System.out.println(\"A print \" + x); }\n}\nclass B extends A {\n    int x = 10;\n    void print() { System.out.println(\"B print \" + x); }\n}\nclass C extends B {\n    int x = 15;\n    void print() { System.out.println(\"C print \" + x); }\n}\nA a = new C();\na.print();\nSystem.out.println(a.x);", options: ["C print 15 then 5", "C print 15 then 15", "A print 5 then 5", "B print 10 then 5"], correct: 0, explanation: "a.print() dispatches dynamically to C's print() → \"C print 15\". a.x is field access via declared type A → 5." },

    { topic: "Cloud Service Models", question: "Which is an example of PaaS?", options: ["AWS EC2", "Google App Engine", "Microsoft 365", "Amazon S3"], correct: 1, explanation: "PaaS platforms like Google App Engine let you deploy code without managing the underlying infrastructure." },
    { topic: "Cloud Service Models", question: "Which is an example of SaaS?", options: ["Azure SQL Database", "Google Kubernetes Engine", "Salesforce", "AWS Lambda"], correct: 2, explanation: "SaaS delivers ready-to-use applications over the internet, such as Salesforce." },
    { topic: "Cloud Service Models", question: "Serverless computing means:", options: ["No servers exist anywhere", "The cloud provider fully manages server provisioning and scaling; you pay per invocation", "It is only for static websites", "You must manage virtual machines manually"], correct: 1, explanation: "Serverless abstracts servers, automatically scales, and charges based on execution or requests." },

    { topic: "Cloud Deployment Models", question: "A public cloud is best described as:", options: ["Cloud services shared among multiple organizations", "Dedicated infrastructure for one organization", "On-premises only", "Only open-source cloud software"], correct: 0, explanation: "Public cloud resources are owned and operated by a provider and shared across multiple tenants." },
    { topic: "Cloud Deployment Models", question: "A private cloud is:", options: ["Public internet only", "Dedicated infrastructure for a single organization", "A free cloud tier", "A community cloud only"], correct: 1, explanation: "Private cloud is dedicated infrastructure used exclusively by one organization, on-premises or hosted." },
    { topic: "Cloud Deployment Models", question: "Hybrid cloud refers to:", options: ["Using multiple public clouds only", "Combining private and public cloud with orchestration", "On-premises only", "Two physical data centers"], correct: 1, explanation: "Hybrid cloud connects private and public environments to share data and applications." },
    { topic: "Cloud Deployment Models", question: "Multi-cloud means:", options: ["Multiple regions in one provider", "Using multiple cloud providers", "Multiple availability zones", "Using public and private cloud together"], correct: 1, explanation: "Multi-cloud is the use of two or more cloud providers, often to avoid vendor lock-in." },
    { topic: "Cloud Deployment Models", question: "A bank must keep sensitive workloads on-premises for compliance but wants cloud for analytics. Which model fits?", options: ["Hybrid cloud", "Public cloud only", "Private cloud only", "No cloud at all"], correct: 0, explanation: "Hybrid cloud keeps sensitive data on-prem while using public cloud for scalable analytics." },

    { topic: "Cloud DR & Backup", question: "RPO (Recovery Point Objective) defines:", options: ["Maximum acceptable downtime", "Maximum acceptable data loss measured in time", "Time to restore service", "Backup frequency"], correct: 1, explanation: "RPO is the maximum tolerable amount of data loss, often expressed in minutes or hours." },
    { topic: "Cloud DR & Backup", question: "RTO (Recovery Time Objective) defines:", options: ["Maximum acceptable data loss", "Maximum acceptable time to restore service after an outage", "Time to detect a failure", "Backup window"], correct: 1, explanation: "RTO is the target duration for restoring service after a disruption." },
    { topic: "Cloud DR & Backup", question: "A pilot light disaster recovery strategy means:", options: ["Minimal core services are running and ready to scale up during recovery", "Fully active in multiple regions", "Backups only with no resources running", "No disaster recovery plan"], correct: 0, explanation: "Pilot light keeps a small footprint ready, then scales up during a failover." },
    { topic: "Cloud DR & Backup", question: "Compared with pilot light, warm standby DR:", options: ["Has a larger pre-provisioned environment running at lower capacity", "Is exactly the same", "Is completely cold", "Is always full-size active-active"], correct: 0, explanation: "Warm standby is more ready than pilot light but costs more because more resources run continuously." },
    { topic: "Cloud DR & Backup", question: "An application requires RPO=0 and RTO < 15 minutes. Which strategy is likely needed?", options: ["Nightly backups only", "Continuous synchronous replication and automated failover to a warm/hot standby", "Offline tape backups", "Manual restore from a snapshot"], correct: 1, explanation: "RPO=0 requires synchronous replication; low RTO requires automated, ready standby resources." },
    { topic: "Cloud DR & Backup", question: "A global system needs disaster recovery across regions with automatic failover and minimal data loss. Which architecture is best?", options: ["Active-active or hot standby multi-region with replication", "Pilot light with manual failover", "Backups only", "Single region multi-AZ only"], correct: 0, explanation: "Multi-region active-active or hot standby with replication meets low RPO and RTO for region failures." },

    { topic: "Cloud Architecture", question: "What is the primary purpose of a load balancer?", options: ["Store data", "Distribute traffic across multiple targets", "Encrypt data", "Monitor logs"], correct: 1, explanation: "Load balancers distribute incoming traffic to improve availability, fault tolerance, and performance." },
    { topic: "Cloud Architecture", question: "An Auto Scaling group is used to:", options: ["Automatically adjust the number of compute instances based on demand", "Manually scale database storage", "Reduce network latency", "Manage DNS records"], correct: 0, explanation: "Auto Scaling maintains desired capacity and scales in or out based on demand or schedules." },
    { topic: "Cloud Architecture", question: "An API Gateway in microservices is used to:", options: ["Store microservices code", "Provide a single entry point for routing, authentication, and rate limiting API requests", "Compile code", "Manage databases"], correct: 1, explanation: "API Gateways centralize cross-cutting concerns and route requests to backend services." },
    { topic: "Cloud Architecture", question: "Microservices architecture means:", options: ["One large monolithic application", "An application split into small, independent services communicating via APIs", "Only serverless functions", "A single deployment artifact"], correct: 1, explanation: "Each microservice can be developed, deployed, and scaled independently." },
    { topic: "Cloud Architecture", question: "What is a cloud landing zone?", options: ["A physical data center", "A pre-configured multi-account environment with security, networking, and identity baselines", "A CDN edge location", "A load balancer"], correct: 1, explanation: "A landing zone establishes a secure foundation for deploying workloads in the cloud." },
    { topic: "Cloud Architecture", question: "Which pillars are part of the AWS Well-Architected Framework?", options: ["Cost, Security, Reliability, Performance Efficiency, Operational Excellence, Sustainability", "Only Security", "Only Cost", "Agile and Lean only"], correct: 0, explanation: "These pillars guide architectural reviews and best practices." },
    { topic: "Cloud Architecture", question: "To protect a web application against an Availability Zone failure, which design should be used?", options: ["Deploy across multiple Availability Zones behind a load balancer", "Deploy in a single Availability Zone", "Use only snapshots", "Use a single server"], correct: 0, explanation: "Multi-AZ deployment provides high availability if one AZ fails." },
    { topic: "Cloud Architecture", question: "A company wants to avoid vendor lock-in. Which approach helps most?", options: ["Use open-source container platforms and multi-cloud compatible services", "Use as many proprietary APIs as possible", "Use a single provider only", "Avoid containers entirely"], correct: 0, explanation: "Containers and open standards increase portability across cloud providers." },
    { topic: "Cloud Architecture", question: "To scale worker instances based on the number of messages in a queue, use:", options: ["CPU utilization only", "Auto scaling with a custom metric for queue depth", "A manual schedule only", "DNS changes"], correct: 1, explanation: "Queue depth is a better signal for asynchronous processing and enables accurate scaling." },

    { topic: "Cloud Networking", question: "An Availability Zone (AZ) is:", options: ["A country where cloud is available", "An isolated location with one or more data centers within a region", "An edge location", "A billing zone"], correct: 1, explanation: "AZs are isolated fault domains inside a region, providing resilience within a geographic area." },
    { topic: "Cloud Networking", question: "A cloud region is:", options: ["A single data center", "A geographical area with multiple Availability Zones", "A CDN point of presence", "A network subnet"], correct: 1, explanation: "A region contains multiple AZs for low-latency and fault isolation." },
    { topic: "Cloud Networking", question: "A Content Delivery Network (CDN) is used to:", options: ["Run databases", "Cache content closer to users to reduce latency", "Manage identity and access", "Store backups"], correct: 1, explanation: "CDNs cache static or dynamic content at edge locations closer to end users." },
    { topic: "Cloud Networking", question: "A Virtual Private Cloud (VPC) is:", options: ["A physical private network", "A logically isolated virtual network in a public cloud", "Only a VPN connection", "The public internet"], correct: 1, explanation: "A VPC lets you define your own IP ranges, subnets, route tables, and gateways in the cloud." },
    { topic: "Cloud Networking", question: "A public subnet in a VPC is one that:", options: ["Has no route table", "Has a route to an internet gateway", "Cannot access the internet", "Is accessible only on-premises"], correct: 1, explanation: "Public subnets have a route to the internet gateway, allowing direct internet access." },
    { topic: "Cloud Networking", question: "In a three-tier VPC design, database servers should be placed in:", options: ["A public subnet", "A private subnet with no direct internet access", "A DMZ only", "An edge location"], correct: 1, explanation: "Databases should be isolated in private subnets; only application or load balancer tiers should be public." },
    { topic: "Cloud Networking", question: "A NAT gateway is used to:", options: ["Allow private instances to initiate outbound internet traffic without exposing inbound access", "Route on-premises traffic", "Load balance traffic", "Store objects"], correct: 0, explanation: "NAT enables outbound-only internet access for private resources while hiding their private IPs." },
    { topic: "Cloud Networking", question: "VPC peering is:", options: ["Connecting two VPCs to route traffic privately", "An internet VPN", "AWS Direct Connect", "Subnet routing only"], correct: 0, explanation: "VPC peering enables private network connectivity between two VPCs." },
    { topic: "Cloud Networking", question: "What is the main difference between VPN and Direct Connect for hybrid cloud?", options: ["VPN uses the public internet; Direct Connect is a dedicated private connection", "Direct Connect is wireless", "VPN is always faster", "There is no difference"], correct: 0, explanation: "Direct Connect provides consistent latency and bandwidth through a dedicated connection." },
    { topic: "Cloud Networking", question: "A Transit Gateway is used to:", options: ["Connect multiple VPCs and on-premises networks through a central hub", "Replace IAM", "Store data", "Cache content"], correct: 0, explanation: "Transit Gateway simplifies complex network architectures compared to many VPC peering connections." },

    { topic: "Cloud Security & IAM", question: "What is the main difference between a security group and a network ACL?", options: ["Security groups are stateful; network ACLs are stateless", "Network ACLs are stateful; security groups are stateless", "Both are stateful", "Both are stateless"], correct: 0, explanation: "Security groups automatically allow return traffic, while NACLs require explicit rules for both directions." },
    { topic: "Cloud Security & IAM", question: "An IAM role is used to:", options: ["Store user passwords long-term", "Grant temporary permissions to users or services without static credentials", "Store data", "Encrypt data"], correct: 1, explanation: "IAM roles provide temporary credentials and help implement least privilege." },
    { topic: "Cloud Security & IAM", question: "The shared responsibility model means:", options: ["The customer owns all security", "The cloud provider secures infrastructure; the customer secures data, identity, and application configuration", "The provider owns all security", "Security costs are shared equally"], correct: 1, explanation: "The provider is responsible for security of the cloud; the customer is responsible for security in the cloud." },

    { topic: "Cloud Economics", question: "An SLA (Service Level Agreement) generally defines:", options: ["Security controls", "Committed service availability and performance, with credits if not met", "Data retention policy", "Pricing only"], correct: 1, explanation: "SLA is a provider commitment, usually expressed as uptime percentage with service credits." },
    { topic: "Cloud Economics", question: "An SLO is:", options: ["An internal target for service reliability, such as 99.95% availability", "A legal contract", "An error budget", "A support plan"], correct: 0, explanation: "SLO is a service level objective; SLI is the service level indicator used to measure it." },
    { topic: "Cloud Economics", question: "Moving from CapEx to OpEx in cloud means:", options: ["Buying more hardware upfront", "Shifting from upfront capital purchases to pay-as-you-go operating expenses", "There is no cost", "Only fixed monthly leases"], correct: 1, explanation: "Cloud consumption converts capital expenditure into flexible operating expenditure." },
    { topic: "Cloud Economics", question: "Total Cost of Ownership (TCO) in cloud should include:", options: ["Only virtual machine cost", "Hardware, facilities, power, licensing, operations, and downtime costs", "Only storage cost", "Only network cost"], correct: 1, explanation: "TCO compares all direct and indirect costs over the life of a solution." },
    { topic: "Cloud Economics", question: "A monthly cloud bill suddenly doubled. What is the first step to investigate?", options: ["Delete all resources immediately", "Use cost explorer and resource tags to identify cost drivers", "Ignore the increase", "Buy reserved instances immediately"], correct: 1, explanation: "Tagging and cost analytics help locate which team, service, or resource caused the increase." },
    { topic: "Cloud Economics", question: "Nightly batch jobs can tolerate interruption. Which pricing model is most cost-effective?", options: ["On-demand always-on VMs", "Spot or preemptible instances", "Dedicated hosts", "Reserved instances only"], correct: 1, explanation: "Spot/preemptible instances are deeply discounted and suitable for fault-tolerant batch workloads." },

    { topic: "Cloud Storage", question: "Which storage type is best for large unstructured objects like images and videos?", options: ["Block storage", "Object storage", "File storage", "RAM"], correct: 1, explanation: "Object storage is highly scalable and ideal for unstructured data with metadata." },

    { topic: "Cloud Databases", question: "A managed database service means:", options: ["You install the database on a VM yourself", "The provider handles patching, backups, and high availability; you manage data and schema", "No administration is ever needed", "It is only available on-premises"], correct: 1, explanation: "Managed databases reduce operational overhead while you retain control of data and schema." },

    { topic: "Cloud DevOps", question: "CI/CD stands for:", options: ["Continuous Installation / Continuous Deployment", "Continuous Integration / Continuous Delivery or Deployment", "Code Integration / Code Delivery", "Cloud Infrastructure / Cloud Deployment"], correct: 1, explanation: "CI/CD automates building, testing, and releasing software." },

    { topic: "Cloud Governance", question: "A Cloud Adoption Framework (CAF) primarily helps with:", options: ["Writing application code", "Organizing people, process, and technology for cloud adoption", "Network routing", "Database tuning"], correct: 1, explanation: "CAF provides guidance across business, people, governance, platform, security, and operations." },

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ========== PROGRESS STORAGE ==========
  const PROGRESS_PREFIX = 'programmingQuizProgress_';
  const LAST_TOPIC_KEY = 'programmingQuizLastTopic';

  function getTopicKey(topic) {
    return PROGRESS_PREFIX + topic;
  }

  function saveCurrentProgress() {
    try {
      const data = {
        answers: answers,
        currentIndex: currentIndex,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(getTopicKey(currentTopic), JSON.stringify(data));
      localStorage.setItem(LAST_TOPIC_KEY, currentTopic);
    } catch (e) {
      console.warn('Could not save progress', e);
    }
  }

  function loadTopicProgress(topic) {
    try {
      const raw = localStorage.getItem(getTopicKey(topic));
      if (!raw) return null;

      const data = JSON.parse(raw);
      if (!Array.isArray(data.answers)) return null;

      const q = topics[topic];
      const savedAnswers = data.answers.slice(0, q.length);
      while (savedAnswers.length < q.length) savedAnswers.push(null);

      return {
        answers: savedAnswers,
        currentIndex: Math.min(data.currentIndex || 0, q.length - 1)
      };
    } catch (e) {
      console.warn('Could not load progress', e);
      return null;
    }
  }

  // ========== QUIZ STATE ==========
  let currentTopic = "Java";
  let questions = topics[currentTopic];
  let currentIndex = 0;
  let selected = null;
  let submitted = false;
  let answers = Array(questions.length).fill(null);

  // ========== FUNCTIONS ==========
  function switchTopic(topic) {
    if (!topics[topic]) return;

    saveCurrentProgress(); // save old topic progress

    currentTopic = topic;
    questions = topics[topic];

    const saved = loadTopicProgress(topic);
    if (saved) {
      currentIndex = saved.currentIndex;
      answers = saved.answers;
      selected = answers[currentIndex];
      submitted = selected !== null;
    } else {
      currentIndex = 0;
      selected = null;
      submitted = false;
      answers = Array(questions.length).fill(null);
    }

    document.getElementById('topic-select').value = topic;
    render();
  }

  function render() {
    const current = questions[currentIndex];

    // Update question number and score
    const answered = answers.filter(a => a !== null).length;
    const score = answers.reduce((acc, a, i) => acc + (a === questions[i].correct ? 1 : 0), 0);
    document.getElementById('question-number').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('score-display').textContent = `Score: ${score}/${answered}`;

    // Update progress bar
    document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

    // Update topic and question
    document.getElementById('topic-tag').textContent = current.topic;
    document.getElementById('question-text').textContent = current.question;

    // Render options
    const optionsHTML = current.options.map((opt, idx) => {
      const isSelected = selected === idx;
      const isCorrect = idx === current.correct;
      let borderColor = 'var(--border)';
      let bgColor = 'transparent';

      if (submitted) {
        if (isCorrect) borderColor = 'var(--border-success)';
        else if (isSelected && !isCorrect) borderColor = 'var(--border-danger)';
      } else if (isSelected) {
        borderColor = 'var(--border-accent)';
        bgColor = 'var(--bg-accent-muted)';
      }

      const opacity = submitted && !isCorrect && !isSelected ? 0.5 : 1;
      const checkmark = submitted && isCorrect ? '✓' : submitted && isSelected && !isCorrect ? '✗' : '';

      return `
        <label style="display: flex; align-items: center; padding: 12px; border: 0.5px solid ${borderColor}; border-radius: var(--radius); cursor: ${submitted ? 'default' : 'pointer'}; background-color: ${bgColor}; opacity: ${opacity};" onclick="selectOption(${idx})">
          <input type="radio" name="quiz-option" ${isSelected ? 'checked' : ''} ${submitted ? 'disabled' : ''} style="margin-right: 12px;" />
          <span style="font-size: 14px; flex: 1;">${escapeHtml(opt)}</span>
          ${checkmark ? `<span style="margin-left: auto; font-weight: bold; ${isCorrect ? 'color: var(--text-success)' : 'color: var(--text-danger)'}">${checkmark}</span>` : ''}
        </label>
      `;
    }).join('');
    document.getElementById('options-container').innerHTML = optionsHTML;

    // Update submit/next button
    const submitBtn = document.getElementById('submit-btn');
    if (!submitted) {
      submitBtn.textContent = 'Check answer';
      submitBtn.onclick = () => submitAnswer();
    } else {
      submitBtn.textContent = 'Next →';
      submitBtn.onclick = () => goToNext();
    }

    // Update feedback
    const feedbackSection = document.getElementById('feedback-section');
    if (submitted) {
      const isCorrect = selected === current.correct;
      feedbackSection.style.display = 'block';
      feedbackSection.style.backgroundColor = isCorrect ? 'var(--bg-success)' : 'var(--bg-danger)';
      feedbackSection.style.color = isCorrect ? 'var(--text-success)' : 'var(--text-danger)';
      document.getElementById('feedback-status').textContent = isCorrect ? 'Correct' : 'Incorrect';
      document.getElementById('feedback-text').textContent = current.explanation;
    } else {
      feedbackSection.style.display = 'none';
    }

    // Update nav buttons
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('prev-btn').style.opacity = currentIndex === 0 ? 0.5 : 1;

    // Render jump buttons
    const jumpHTML = questions.map((_, idx) => {
      const ans = answers[idx];
      const isCorrect = ans === questions[idx].correct;
      let bgColor = 'transparent';
      let borderColor = 'var(--border)';
      let textColor = 'var(--text-secondary)';

      if (ans !== null) {
        if (isCorrect) {
          bgColor = 'var(--bg-success)';
          textColor = 'var(--text-success)';
        } else {
          bgColor = 'var(--bg-danger)';
          textColor = 'var(--text-danger)';
        }
      }
      if (idx === currentIndex) borderColor = 'var(--border-accent)';

      return `<button onclick="goToQuestion(${idx})" style="width: 24px; height: 24px; font-size: 11px; padding: 0; border: 0.5px solid ${borderColor}; border-radius: 4px; background-color: ${bgColor}; color: ${textColor}; cursor: pointer;">${idx + 1}</button>`;
    }).join('');
    document.getElementById('jump-buttons').innerHTML = jumpHTML;

    // Check if complete
    const allAnswered = answers.every(a => a !== null);
    const completeSection = document.getElementById('complete-section');
    if (allAnswered && currentIndex === questions.length - 1 && submitted) {
      completeSection.style.display = 'block';
      const finalScore = answers.reduce((acc, a, i) => acc + (a === questions[i].correct ? 1 : 0), 0);
      document.getElementById('final-score').textContent = `${finalScore}/${questions.length}`;
    } else {
      completeSection.style.display = 'none';
    }
  }

  function selectOption(idx) {
    if (!submitted) {
      selected = idx;
      render();
    }
  }

  function submitAnswer() {
    if (selected === null) {
      alert('Please select an answer');
      return;
    }
    submitted = true;
    answers[currentIndex] = selected;
    saveCurrentProgress();
    render();
  }

  function clearAnswer() {
    // Only allow clearing if an answer was already submitted
    if (!submitted) return;

    // Remove the stored answer for the current question
    answers[currentIndex] = null;
    selected = null;
    submitted = false;

    // Save the updated progress to localStorage
    saveCurrentProgress();

    // Re-render the question
    render();
  }

  function goToQuestion(idx) {
    currentIndex = idx;
    selected = answers[idx];
    submitted = answers[idx] !== null;
    saveCurrentProgress();
    render();
  }

  function goToNext() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      selected = answers[currentIndex];
      submitted = answers[currentIndex] !== null;
      saveCurrentProgress();
      render();
    }
  }

  function goToPrevious() {
    if (currentIndex > 0) {
      currentIndex--;
      selected = answers[currentIndex];
      submitted = answers[currentIndex] !== null;
      saveCurrentProgress();
      render();
    }
  }

  function resetQuiz() {
    currentIndex = 0;
    selected = null;
    submitted = false;
    answers = Array(questions.length).fill(null);

    try {
      localStorage.removeItem(getTopicKey(currentTopic));
    } catch (e) {
      console.warn('Could not clear saved progress', e);
    }

    render();
  }

  function exportProgress() {
    saveCurrentProgress(); // make sure current topic is saved

    const allData = {};
    Object.keys(topics).forEach(topic => {
      const raw = localStorage.getItem(getTopicKey(topic));
      if (raw) {
        allData[topic] = JSON.parse(raw);
      }
    });

    allData.lastTopic = localStorage.getItem(LAST_TOPIC_KEY) || currentTopic;

    const blob = new Blob([JSON.stringify(allData, null, 2)], {
      type: 'application/json'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'quiz-progress.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importProgress(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const data = JSON.parse(e.target.result);

        Object.keys(data).forEach(key => {
          if (key === 'lastTopic') {
            localStorage.setItem(LAST_TOPIC_KEY, data[key]);
          } else if (topics[key] && data[key] && Array.isArray(data[key].answers)) {
            localStorage.setItem(getTopicKey(key), JSON.stringify(data[key]));
          }
        });

        const lastTopic = localStorage.getItem(LAST_TOPIC_KEY) || 'Java';
        currentTopic = lastTopic;
        questions = topics[currentTopic];

        const saved = loadTopicProgress(currentTopic);
        if (saved) {
          currentIndex = saved.currentIndex;
          answers = saved.answers;
          selected = answers[currentIndex];
          submitted = selected !== null;
        } else {
          resetQuiz();
        }

        document.getElementById('topic-select').value = currentTopic;
        render();
        alert('Progress imported successfully.');
      } catch (err) {
        alert('Invalid progress file.');
      }
    };

    reader.readAsText(file);
  }

  // ========== INITIAL RENDER ==========
  function initQuiz() {
    const lastTopic = localStorage.getItem(LAST_TOPIC_KEY);

    if (lastTopic && topics[lastTopic]) {
      currentTopic = lastTopic;
      questions = topics[currentTopic];

      const saved = loadTopicProgress(currentTopic);
      if (saved) {
        currentIndex = saved.currentIndex;
        answers = saved.answers;
        selected = answers[currentIndex];
        submitted = selected !== null;
      } else {
        resetQuiz();
      }
    } else {
      currentTopic = "Java";
      questions = topics[currentTopic];
      resetQuiz();
    }

    document.getElementById('topic-select').value = currentTopic;
    render();
  }

  initQuiz();
</script>

</body>
</html>
