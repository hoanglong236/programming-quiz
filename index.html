    { topic: "Servlet", question: "A developer is building a web application and needs to implement the following tasks:\n(1) Read a servlet initialization parameter configured in web.xml\n(2) Invalidate the current user's session (e.g., for logout)\n(3) Define a global error page for exceptions in web.xml\n(4) Display a request attribute named 'message' in a JSP using EL\n\nWhich combination correctly accomplishes these tasks?", options: ["getServletConfig().getInitParameter(\"param\") ; session.invalidate() ; <error-page><exception-type>java.lang.Throwable</exception-type><location>/error.jsp</location></error-page> ; ${requestScope.message}", "getServletContext().getInitParameter(\"param\") ; session.logout() ; <error-page><error-code>500</error-code><location>/error.jsp</location></error-page> ; #{message}", "getServletConfig().getParameter(\"param\") ; request.getSession().destroy() ; <exception>Throwable</exception><page>/error.jsp</page> ; ${message}", "getServletContext().getParameter(\"param\") ; request.getSession().invalidate() ; <error-page><exception-type>Exception</exception-type><page>/error.jsp</page> ; <%= request.getAttribute(\"message\") %>"], correct: 0, explanation: "1) Servlet initialization parameters are read via getServletConfig().getInitParameter(\"param\"), not from ServletContext. 2) To invalidate a session, use session.invalidate() (logout is not a standard method). 3) Global error pages for exceptions are defined in web.xml with <error-page><exception-type>java.lang.Throwable</exception-type><location>/error.jsp</location></error-page>. 4) In JSP EL, request attributes are accessed via ${requestScope.message}. Option 1 is the only correct set." },

    // ===== JAVA EE (5) =====
    { topic: "Java EE", question: "Which Java EE technology is used for building RESTful web services?", options: ["JAX-WS", "JAX-RS", "JMS", "JPA"], correct: 1, explanation: "JAX-RS (Java API for RESTful Web Services) is the standard Java EE API for building RESTful web services. It provides annotations like @Path, @GET, @POST, @Produces.\n\n- JAX-WS is used for SOAP-based web services (heavyweight, XML-based).\n- JMS is for asynchronous messaging via queues/topics.\n- JPA is for object-relational mapping and database persistence.\n\nThus, JAX-RS is the correct answer for REST." },
    { topic: "Java EE", question: "Which annotation is used to inject a dependency in Java EE?", options: ["@Inject", "@Resource", "@EJB", "All of the above"], correct: 3, explanation: "Java EE supports multiple injection annotations, each for a different purpose:\n- @Inject (CDI) injects CDI-managed beans.\n- @Resource injects container-managed resources like DataSource, JMS queues/topics, and environment entries.\n- @EJB injects Enterprise JavaBeans (stateless, stateful, or singleton session beans).\n\nNote: @Autowired is a Spring annotation, not part of Java EE. All three listed options (@Inject, @Resource, @EJB) are valid Java EE annotations, so 'All of the above' is correct." },
    { topic: "Java EE", question: "Which of the following correctly describes the roles of JMS, JNDI, and EJB in Java EE?", options: ["JMS is for messaging, JNDI for naming/lookup, EJB for server-side components", "JMS is for naming/lookup, JNDI for messaging, EJB for persistence", "JMS is for server-side components, JNDI for persistence, EJB for messaging", "JMS is for persistence, JNDI for transactions, EJB for naming/lookup"], correct: 0, explanation: "JMS (Java Message Service) enables asynchronous messaging via queues/topics. JNDI (Java Naming and Directory Interface) is used to look up resources by name (e.g., EJBs, DataSources). EJB (Enterprise JavaBeans) is a server-side component model for building scalable, transactional enterprise applications." },
    { topic: "Java EE", question: "Which of the following correctly describes JPA's @Entity, JTA, and EntityManager?", options: ["@Entity is for transactions, JTA is for mapping classes, EntityManager is for lookup", "@Entity maps a class to a database table, JTA manages transactions, EntityManager performs CRUD operations and queries", "@Entity is for lookup, JTA is for messaging, EntityManager is for transactions", "@Entity is for dependency injection, JTA is for caching, EntityManager is for servlet management"], correct: 1, explanation: "@Entity (JPA) marks a class as a database-mapped entity. JTA (Java Transaction API) provides a standard way to manage transactions, including distributed transactions. EntityManager is an interface for CRUD operations and query execution on entities, managing the persistence context." },
    { topic: "Java EE", question: "A developer is choosing between EJB bean types for a Java EE application. Which combination correctly matches each scenario to the appropriate bean type?\n\n(a) A bean that holds conversational state for a specific client across multiple method calls\n(b) A bean that is stateless and pooled by the container for scalability\n(c) A bean that is instantiated once per application and shared across all clients", options: ["(a) @Stateful (b) @Stateless (c) @Singleton", "(a) @Stateless (b) @Stateful (c) @Singleton", "(a) @Singleton (b) @Stateless (c) @Stateful", "(a) @Stateful (b) @Singleton (c) @Stateless"], correct: 0, explanation: "EJB defines three main session bean types:\n- @Stateful: maintains conversational state with a specific client across multiple method invocations; the instance is dedicated to that client until the conversation ends.\n- @Stateless: does not hold client state between calls; instances are pooled and reused by the container, making it highly scalable for stateless business logic.\n- @Singleton: exactly one instance per application (or per JVM/module), shared across all clients; useful for shared caches, configuration, or startup tasks.\n\nThere is also @MessageDriven, which handles JMS messages asynchronously, but it is not a session bean." },

    // ===== HIBERNATE (5) =====
    { topic: "Hibernate", question: "What is the relationship between Hibernate and the Java Persistence API (JPA)?", options: ["Hibernate is a competing standard that cannot be used with JPA annotations", "Hibernate is an ORM framework that implements the JPA specification and adds Hibernate-specific features (e.g., HQL, native Criteria API)", "Hibernate is a relational database management system that replaces JDBC", "Hibernate is a web framework for building servlets and JSPs"], correct: 1, explanation: "JPA is a specification (interfaces + annotations) for object-relational mapping. Hibernate is the most popular implementation of JPA — it can be used with standard JPA annotations (@Entity, @Id, etc.) and also provides Hibernate-specific extensions like HQL and its own Criteria API. Using Hibernate does not lock you out of JPA; you can switch to another JPA provider (e.g., EclipseLink) with minimal code changes if you stick to the standard." },
    { topic: "Hibernate", question: "A developer is reviewing Hibernate's session architecture:\n\n(a) Which statement about SessionFactory and Session is correct?\n(b) Which statement accurately describes the first-level cache?", options: ["(a) SessionFactory is heavyweight and thread-safe; Session is lightweight and not thread-safe\n(b) The first-level cache is session-scoped, enabled by default, and ensures repeated reads of the same entity ID within a Session return the same instance", "(a) SessionFactory is lightweight and per-request; Session is heavyweight and thread-safe\n(b) The first-level cache is shared across all sessions and must be explicitly enabled", "(a) SessionFactory and Session are both thread-safe and interchangeable\n(b) The first-level cache is disabled by default and configured in hibernate.cfg.xml", "(a) SessionFactory is created per request; Session is created once per application\n(b) The first-level cache stores data across sessions and is used for query caching"], correct: 0, explanation: "(a) SessionFactory is a heavyweight, thread-safe object created once per application; it holds configuration and mappings. Session is a lightweight, non-thread-safe unit of work (similar to a JDBC connection) and should be created per request/transaction.\n(b) The first-level cache is always on and tied to the Session. Within one Session, reading the same entity by ID twice returns the same object instance without a second database hit. It is not shared across sessions — for cross-session caching you need the second-level cache (e.g., Ehcache, Redis)." },
    { topic: "Hibernate", question: "What is the default fetch type for @OneToMany and @ManyToOne associations in JPA/Hibernate?", options: ["Both are EAGER by default", "Both are LAZY by default", "@OneToMany is LAZY; @ManyToOne is EAGER by default", "@OneToMany is EAGER; @ManyToOne is LAZY by default"], correct: 2, explanation: "In JPA (and Hibernate follows the spec), collection-valued associations are LAZY by default to avoid loading large collections unnecessarily: @OneToMany and @ManyToMany are LAZY. Single-valued associations are EAGER by default: @ManyToOne and @OneToOne are EAGER. A common performance trap is forgetting that @ManyToOne EAGER can trigger N+1 queries when loading a list of entities — often the fix is to switch it to LAZY and use a fetch join when the related data is actually needed." },
    { topic: "Hibernate", question: "Which of the following correctly lists the lifecycle states of an entity object in Hibernate, and what each means?", options: ["Transient (not associated with any Session, no DB row), Persistent (associated with a Session, managed), Detached (was persistent but the Session is now closed)", "New (not saved), Managed (saved), Removed (deleted from DB immediately)", "Created (in memory), Updated (dirty), Deleted (marked for deletion at commit)", "Attached (has an ID), Unattached (no ID), Orphan (parent removed)"], correct: 0, explanation: "Hibernate defines three main entity states:\n- Transient: a new object not associated with any Session and with no corresponding DB row. Changes are not tracked.\n- Persistent: associated with an open Session; changes are tracked and flushed to the DB on transaction commit.\n- Detached: was persistent, but its Session has been closed. Changes are no longer tracked unless the entity is reattached via merge()/update().\n\nOther options use non-standard terminology or incorrect descriptions (e.g., 'Removed' is an operation, not a state; orphans refer to a collection-removal rule, not a lifecycle state)." },
    { topic: "Hibernate", question: "What is the purpose of the @Version annotation in Hibernate/JPA, and what happens when two transactions modify the same entity concurrently?", options: ["It marks a field for optimistic locking; the second transaction to commit fails with OptimisticLockException, preventing lost updates", "It generates a UUID for each entity instance automatically", "It specifies the database schema version used for Flyway/Liquibase migrations", "It tracks the last modification timestamp purely for auditing purposes"], correct: 0, explanation: "@Version enables optimistic locking: Hibernate adds a version column (int, long, or timestamp) and increments it on every update. When two transactions read the same entity and both try to update it, the second commit checks the version — if it has changed, Hibernate throws OptimisticLockException and rolls back, preventing the 'lost update' problem. It is not for UUID generation, schema migration, or auditing (though the version field can be a useful audit signal). Optimistic locking is preferred over pessimistic locking when conflicts are rare and you want to avoid long-held DB locks." },

    // ===== SPRING (10) =====
    { topic: "Spring", question: "What is the primary purpose of Spring's Inversion of Control (IoC) container?", options: ["To manage object creation and dependency injection, reducing coupling between components", "To provide a web framework for building REST APIs", "To replace the Java Virtual Machine with a more efficient runtime", "To handle database transactions automatically without any configuration"], correct: 0, explanation: "The Spring IoC container is responsible for instantiating, configuring, and assembling beans. It uses dependency injection to manage object lifecycles and their dependencies, promoting loose coupling and testability." },
    { topic: "Spring", question: "What is the difference between @Component and @Bean in Spring?", options: ["@Component is used on classes, @Bean is used on methods; both result in a bean being registered", "@Component is for configuration, @Bean is for scanning", "@Component is only for controllers, @Bean is for services", "They are identical and interchangeable"], correct: 0, explanation: "@Component is a class-level annotation that allows Spring to auto-detect and register the class as a bean via component scanning. @Bean is a method-level annotation used inside @Configuration classes to explicitly declare a bean and control its instantiation." },
    { topic: "Spring", question: "What is the purpose of Spring Boot's auto-configuration?", options: ["To automatically configure beans based on dependencies present on the classpath and sensible defaults", "To automatically generate a user interface for the application", "To eliminate the need for any configuration files", "To automatically scale the application in the cloud"], correct: 0, explanation: "Spring Boot's @EnableAutoConfiguration (or @SpringBootApplication) examines the classpath and existing beans, then configures missing infrastructure beans (e.g., DataSource, EntityManagerFactory) based on libraries present, reducing boilerplate configuration." },
    { topic: "Spring", question: "What is a 'Spring Boot Starter'?", options: ["A Maven/Gradle plugin for building Spring Boot applications", "A pre-packaged set of dependencies for a specific functionality, simplifying dependency management", "A template for creating new Spring Boot projects", "A class that starts the Spring application context"], correct: 1, explanation: "Starters (e.g., spring-boot-starter-web, spring-boot-starter-data-jpa) are curated dependency descriptors that pull in all necessary transitive dependencies for a feature, saving developers from managing versions manually." },
    { topic: "Spring", question: "In Spring Data JPA, what does the @Transactional annotation do at the service layer?", options: ["It ensures that a method executes within a database transaction and rolls back on unchecked exceptions", "It automatically commits after each repository call", "It makes the method asynchronous", "It disables the first-level cache of Hibernate"], correct: 0, explanation: "Spring's @Transactional demarcates transactional boundaries using AOP. By default, it rolls back on RuntimeException and Error (unchecked exceptions) but not checked exceptions, unless configured with rollbackFor." },
    { topic: "Spring", question: "In a Spring Boot application using Spring Data JPA (Hibernate as provider), you have a service method annotated with @Transactional that saves a parent entity with a cascade of child entities. Suddenly, a RuntimeException is thrown after the save. What is the state of the transaction and the database?", options: ["The transaction is rolled back completely; neither parent nor children are persisted.", "The transaction is committed partially; parent is saved but children are not.", "The transaction is rolled back only for the RuntimeException, but earlier writes are flushed.", "The behavior depends on the database isolation level."], correct: 0, explanation: "Because the method is @Transactional, a RuntimeException triggers a rollback. Spring manages the transaction boundary; unless you have configured noRollbackFor or the exception is caught, the entire transaction (including all writes) is rolled back. Hibernate's first-level cache discards pending changes." },
    { topic: "Spring", question: "You have a Spring Boot REST API that returns an entity directly from a @RestController method. The entity has a lazy-loaded @OneToMany collection. However, when the controller returns, you get a LazyInitializationException. Which solution is the most appropriate to fix this while maintaining the lazy loading behavior?", options: ["Annotate the collection with fetch = FetchType.EAGER", "Add spring.jpa.open-in-view=true to application.properties", "Use a DTO and fetch the required data in a transactional service method before returning", "Annotate the controller method with @Transactional"], correct: 2, explanation: "The best practice is to use DTOs to avoid exposing entities directly and to fetch necessary data within the transactional service layer. While open-in-view is a quick fix, it is an anti-pattern in production as it keeps a DB connection open for the entire HTTP request. EAGER fetching negates lazy loading and can cause performance issues." },
    { topic: "Spring", question: "In a Spring Security configuration, you load user details from a database using a custom UserDetailsService that calls a Spring Data JPA repository. What is the typical role of the @Transactional annotation on the loadUserByUsername method, and what potential issue can arise if it is omitted?", options: ["It ensures the method is executed within a transaction, preventing LazyInitializationException when accessing roles; omitting it may cause the session to close before lazy-loaded authorities are accessed.", "It enables security auditing; omitting it causes an AuthenticationException.", "It encrypts the password; omitting it results in plain-text passwords.", "It has no effect; UserDetailsService methods are always transactional."], correct: 0, explanation: "The loadUserByUsername method often accesses lazy associations (e.g., user roles). Without a transaction, Hibernate's session may close before the authorities are fetched, throwing LazyInitializationException. Spring Security's default UserDetailsService may not be transactional, so adding @Transactional ensures the session stays open during the method." },
    { topic: "Spring", question: "A method in a Spring service is annotated with @Transactional(propagation = Propagation.REQUIRES_NEW). It is called from another method that is also @Transactional. What is the behavior?", options: ["The inner method runs in the same transaction as the outer method.", "The inner method suspends the outer transaction and starts a new, independent transaction; if the inner method commits, changes are visible immediately, regardless of outer transaction rollback.", "The inner method throws an exception because nested transactions are not supported.", "The outer method's transaction is committed before the inner method starts."], correct: 1, explanation: "REQUIRES_NEW always starts a new transaction, suspending any existing one. The new transaction commits or rolls back independently. If the outer transaction later rolls back, the inner transaction's work remains committed. This is useful for audit logging or operations that must not be rolled back." },
    { topic: "Spring", question: "You are designing a REST endpoint that returns a list of 10,000 entities from a Spring Data JPA repository. You notice high memory consumption and slow response. Which combination of techniques is most appropriate to improve performance?", options: ["Return the full entity list; it's the simplest approach.", "Use Pageable and return a Page object, and also fetch only needed fields using a projection (interface or DTO).", "Set fetch = FetchType.EAGER on all associations to reduce queries.", "Increase JVM heap size."], correct: 1, explanation: "Returning 10,000 full entities is inefficient. Using pagination (Pageable) limits the result set, and projections (DTOs) reduce the amount of data transferred and memory footprint. EAGER fetching would load all associations causing even more data. Increasing heap size is a band-aid, not a solution." },
  ];

    { topic: "C# Basics", question: "Which keyword prevents a class from being inherited?", options: ["static", "sealed", "abstract", "readonly"], correct: 1, explanation: "A `sealed` class cannot be inherited; `static` classes cannot be instantiated, and `abstract` classes must be inherited." },
    { topic: "C# Basics", question: "What is the default access modifier for a top-level class in C#?", options: ["public", "private", "internal", "protected"], correct: 2, explanation: "Top-level classes are `internal` by default, meaning they are accessible only within the same assembly." },
    { topic: "C# Basics", question: "Which statement about value types and reference types is true?", options: ["`int` is a reference type; `string` is a value type", "`struct` is a reference type; `class` is a value type", "`int` and `struct` are value types; `class` and `string` are reference types", "All types are reference types"], correct: 2, explanation: "Value types store data directly on the stack, while reference types store a reference to data on the heap." },
    { topic: "C# Basics", question: "What is boxing in C#?", options: ["Converting a reference type to a value type", "Converting a value type to an object or reference type", "Wrapping a class inside another class", "Restricting access to a member"], correct: 1, explanation: "Boxing wraps a value type in an object on the heap; unboxing extracts it back to a value type." },
    { topic: "C# Basics", question: "Which keyword declares a field whose value can be assigned in the constructor but not changed afterwards?", options: ["const", "readonly", "static", "sealed"], correct: 1, explanation: "`readonly` fields can be assigned at declaration or in a constructor, but not modified later; `const` is compile-time constant." },
    { topic: "C# Basics", question: "What is the purpose of the `using` statement in the following code?\nusing (var stream = new FileStream(\"file.txt\", FileMode.Open))\n{\n    // read stream\n}", options: ["Import a namespace", "Ensure the stream is disposed when the block exits", "Declare a variable", "Create an alias"], correct: 1, explanation: "The `using` statement calls `Dispose()` on `IDisposable` objects even if an exception occurs." },
    { topic: "C# Basics", question: "Which access modifier makes a member accessible only inside its containing class?", options: ["public", "private", "protected", "internal"], correct: 1, explanation: "`private` members are accessible only within the same class." },
    { topic: "C# Basics", question: "What is the base class for all types in C#?", options: ["`object`", "`System.Type`", "`ValueType`", "`Base`"], correct: 0, explanation: "Every type in C# ultimately derives from `System.Object`." },
    { topic: "C# Basics", question: "Which .NET component automatically manages memory?", options: ["CLR", "JIT", "Garbage Collector", "CTS"], correct: 2, explanation: "The GC automatically reclaims memory used by unreachable managed objects." },
    { topic: "C# Basics", question: "What does string immutability mean in C#?", options: ["Strings can be changed using `=` only", "Once created, a string’s content cannot be changed; modifications create a new string", "Strings are value types", "Strings are thread-safe only if sealed"], correct: 1, explanation: "`string` objects are immutable; methods like `Replace` return new strings." },
    { topic: "C# Basics", question: "Which method converts a string to an int without throwing an exception on invalid input?", options: ["`int.Parse`", "`Convert.ToInt32`", "`int.TryParse`", "`(int)string`"], correct: 2, explanation: "`TryParse` returns `true`/`false` instead of throwing, making it safe for invalid input." },
    { topic: "C# Basics", question: "Which method is called by the garbage collector when an object has a finalizer?", options: ["`Dispose()`", "`Finalize()`", "`Close()`", "`Destructor()`"], correct: 1, explanation: "The C# finalizer `~ClassName()` is compiled to an override of `Finalize()`." },
    { topic: "C# Basics", question: "What is the main purpose of `IDisposable`?", options: ["Trigger the garbage collector", "Release unmanaged resources deterministically", "Mark a class as disposable", "Prevent inheritance"], correct: 1, explanation: "`IDisposable` provides a `Dispose` method to free resources immediately instead of waiting for GC." },
    { topic: "C# Basics", question: "What should happen if `Dispose()` is called twice on a properly implemented object?", options: ["It throws an exception", "The second call should be safe and do nothing", "The object is finalized immediately", "It causes a memory leak"], correct: 1, explanation: "A well-implemented `Dispose` pattern is idempotent and guards against repeated disposal." },
    { topic: "C# Basics", question: "Which keyword is used to create an extension method?", options: ["`static` class with a `static` method whose first parameter has the `this` modifier", "`partial`", "`extern`", "`sealed`"], correct: 0, explanation: "Extension methods must be declared in a static class with `this` on the first parameter." },
    { topic: "C# Basics", question: "Which C# feature provides concise syntax for immutable reference types with value-based equality?", options: ["`record`", "`interface`", "`delegate`", "`enum`"], correct: 0, explanation: "Records generate value-based equality, `ToString`, and constructor/deconstructor members." },
    { topic: "C# Basics", question: "Which statement about `const` and `readonly` is correct?", options: ["`const` can be assigned in a constructor; `readonly` cannot", "`const` is a compile-time constant; `readonly` can be assigned at runtime in a constructor", "Both are runtime constants", "`readonly` can be changed after the constructor"], correct: 1, explanation: "`const` is fixed at compile time; `readonly` can be set in a constructor." },
    { topic: "C# Basics", question: "What is the default value of a `bool` field in a class?", options: ["true", "false", "null", "0"], correct: 1, explanation: "The default value of `bool` is `false`." },
    { topic: "C# Basics", question: "Which interface defines a method to compare the current object with another object for sorting?", options: ["`IComparable`", "`ICloneable`", "`IDisposable`", "`IEnumerable`"], correct: 0, explanation: "`IComparable` defines `CompareTo`, used for custom sorting." },
    { topic: "C# Basics", question: "What is the default access modifier for interface members in C#?", options: ["private", "public", "internal", "protected"], correct: 1, explanation: "Interface members without access modifiers are implicitly public." },
    { topic: "C# Basics", question: "Which statement about structs in C# is true?", options: ["They can inherit from another struct", "They are reference types", "They can implement interfaces", "They cannot implement interfaces"], correct: 2, explanation: "Structs are value types and can implement interfaces, but they cannot inherit from other structs or classes." },
    { topic: "C# Basics", question: "Which statement about delegates is true?", options: ["A delegate is a value type", "A delegate is a type-safe function pointer", "A delegate can only point to static methods", "A delegate cannot be multicast"], correct: 1, explanation: "Delegates hold references to methods with compatible signatures and can be invoked type-safely." },

    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nint x = 5;\nint y = x++;\nConsole.WriteLine($\"{x},{y}\");", options: ["5,5", "6,5", "5,6", "6,6"], correct: 1, explanation: "`x++` returns the old value 5 to `y`, then increments `x` to 6." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nclass A { public virtual void Print() => Console.Write(\"A\"); }\nclass B : A { public override void Print() => Console.Write(\"B\"); }\nA obj = new B();\nobj.Print();", options: ["A", "B", "AB", "Compile error"], correct: 1, explanation: "Because `Print` is `virtual` and overridden in `B`, runtime dispatch calls the derived implementation." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nclass A { public void Print() => Console.Write(\"A\"); }\nclass B : A { public new void Print() => Console.Write(\"B\"); }\nA obj = new B();\nobj.Print();", options: ["A", "B", "AB", "Runtime error"], correct: 0, explanation: "`new` hides the method instead of overriding it; the base class reference calls `A.Print`." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nint[] arr = {1, 2, 3};\nvar result = arr.Where(x => x > 1).Sum();\nConsole.WriteLine(result);", options: ["1", "3", "5", "6"], correct: 2, explanation: "Elements greater than 1 are 2 and 3; their sum is 5." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nstring s = \"Hello\";\ns += \" World\";\nConsole.WriteLine(s);", options: ["Hello", "World", "Hello World", "Compile error"], correct: 2, explanation: "`+=` creates a new string containing the concatenation, and `s` references that new string." },
    { topic: "C# Coding & OOP Calc", question: "What is the result of `7 / 2` in C# when both operands are `int`?", options: ["3.5", "4", "3", "3.0"], correct: 2, explanation: "Integer division truncates the decimal part, so 7 / 2 equals 3." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\ntry\n{\n    int x = 0;\n    int y = 5 / x;\n}\ncatch (DivideByZeroException)\n{\n    Console.Write(\"A\");\n}\nfinally\n{\n    Console.Write(\"B\");\n}", options: ["A", "B", "AB", "Compile error"], correct: 2, explanation: "The `catch` block writes `A`, then `finally` always executes and writes `B`." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nConsole.WriteLine(Math.Round(2.5));", options: ["2", "3", "2.5", "0"], correct: 0, explanation: "`Math.Round` uses banker’s rounding by default, so 2.5 rounds to the nearest even number, 2." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nConsole.WriteLine(Math.Round(3.5));", options: ["3", "4", "3.5", "0"], correct: 1, explanation: "Banker’s rounding rounds 3.5 to the nearest even number, 4." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\npublic class Base\n{\n    public Base() { Console.Write(\"B\"); }\n}\npublic class Derived : Base\n{\n    public Derived() { Console.Write(\"D\"); }\n}\nnew Derived();", options: ["BD", "DB", "B", "D"], correct: 0, explanation: "The base class constructor runs before the derived constructor, so `B` is printed first." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\npublic class Base\n{\n    public Base(string s) { Console.Write(\"B\" + s); }\n}\npublic class Derived : Base\n{\n    public Derived() : base(\"X\") { Console.Write(\"D\"); }\n}\nnew Derived();", options: ["BXD", "DBX", "XBD", "Compile error"], correct: 0, explanation: "`base(\"X\")` calls the base constructor and prints `BX`, then the derived constructor prints `D`." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\npublic static class Ext\n{\n    public static int Double(this int x) => x * 2;\n}\nint a = 5;\nConsole.WriteLine(a.Double());", options: ["5", "10", "Compile error", "Runtime error"], correct: 1, explanation: "The extension method `Double` is called on `a` and returns `5 * 2 = 10`." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nrecord Point(int X, int Y);\nvar p1 = new Point(1, 2);\nvar p2 = new Point(1, 2);\nConsole.WriteLine(p1 == p2);", options: ["True", "False", "Compile error", "Runtime error"], correct: 0, explanation: "Record types implement value-based equality, so two records with the same values are equal." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nint? x = null;\nint y = x ?? 10;\nConsole.WriteLine(y);", options: ["0", "null", "10", "Compile error"], correct: 2, explanation: "The null-coalescing operator `??` returns the right-hand operand when the left is null." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nstring s = null;\nConsole.WriteLine(s?.Length ?? -1);", options: ["`NullReferenceException`", "-1", "0", "Compile error"], correct: 1, explanation: "`s?.Length` returns `null` because `s` is null; `??` then returns -1." },
    { topic: "C# Coding & OOP Calc", question: "What is the output of the following code?\nint[] arr = { 5, 3, 8, 1 };\nvar result = arr.OrderBy(x => x).First();\nConsole.WriteLine(result);", options: ["5", "1", "8", "3"], correct: 1, explanation: "`OrderBy` sorts ascending, so the first element is the smallest, 1." },

    { topic: "Joins & Set Operations", question: "What is a NATURAL JOIN?", options: ["Joins using all common column names", "Joins using explicit ON", "Cross join", "Self join"], correct: 0, explanation: "NATURAL JOIN automatically matches columns with the same name." },
    { topic: "Joins & Set Operations", question: "Which statement about FULL OUTER JOIN is true?", options: ["It returns only matched rows", "It returns all rows from both sides, matching where possible", "It cannot include NULLs", "It requires no keys"], correct: 1, explanation: "FULL JOIN includes unmatched rows from both tables." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Tables:\n`customers(id, name)`: (1,'A'), (2,'B'), (3,'C')\n`orders(id, customer_id)`: (101,1), (102,2), (103,2), (104,NULL)\n\nQuery:\nSELECT c.name, COUNT(o.id)\nFROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nGROUP BY c.name\nORDER BY c.name;\nWhat is the count for customer 'C'?", options: ["0", "1", "2", "NULL"], correct: 0, explanation: "C has no orders; COUNT(o.id) counts only non-NULL order IDs." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Same tables as previous.\n\nQuery:\nSELECT c.name\nFROM customers c\nJOIN orders o ON c.id = o.customer_id\nGROUP BY c.name\nHAVING COUNT(o.id) > 1;\nWhich name is returned?", options: ["A", "B", "C", "A and B"], correct: 1, explanation: "Only B has two orders." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Tables:\n`employees(id, name, dept_id)`: (1,'A',10), (2,'B',20), (3,'C',10), (4,'D',NULL)\n`departments(id, dept_name)`: (10,'HR'), (20,'IT'), (30,'FIN')\n\nQuery:\nSELECT e.name, d.dept_name\nFROM employees e\nRIGHT JOIN departments d ON e.dept_id = d.id\nORDER BY d.id, e.name;\nHow many rows are returned?", options: ["2", "3", "4", "5"], correct: 2, explanation: "HR has 2 employees, IT has 1, FIN has 1 unmatched row → 4 rows." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Table `a(x)`: 1, 2, 3\nTable `b(y)`: 2, 3, 4\n\nQuery:\nSELECT x FROM a\nUNION\nSELECT y FROM b\nORDER BY x;", options: ["1, 2, 3, 4", "2, 3", "1, 2, 2, 3, 3, 4", "1, 2, 3, 4, 4"], correct: 0, explanation: "UNION removes duplicates and sorts the final set." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Same tables as previous.\n\nQuery:\nSELECT x FROM a\nINTERSECT\nSELECT y FROM b;", options: ["1, 2, 3", "2, 3", "1", "Empty"], correct: 1, explanation: "Common values between A and B are 2 and 3." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Same tables as previous.\n\nQuery:\nSELECT x FROM a\nEXCEPT\nSELECT y FROM b;", options: ["1", "4", "1, 4", "Empty"], correct: 0, explanation: "1 exists in A but not in B; 4 is only in B." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Table `orders(id, total)`: (1,100), (2,200), (3,150)\n\nQuery:\nSELECT SUM(total)\nFROM orders\nWHERE id IN (SELECT id FROM orders WHERE total >= 150);", options: ["300", "350", "450", "500"], correct: 1, explanation: "IDs with total ≥150 are 2 and 3; SUM = 200 + 150 = 350." },
    { topic: "Joins & Set Operations - Sample Execute", question: "Table `emp(id, name, mgr_id)`:\n(1,'Alice',NULL), (2,'Bob',1), (3,'Carol',1), (4,'Dave',2)\n\nQuery:\nSELECT e.name, m.name AS manager\nFROM emp e\nLEFT JOIN emp m ON e.mgr_id = m.id\nORDER BY e.id;\nWhat is Alice's manager?", options: ["NULL", "Alice", "Bob", "Carol"], correct: 0, explanation: "Alice has no manager; LEFT JOIN returns NULL for m.name." },

    { topic: "Aggregation & Grouping", question: "Which clause is required when using aggregate functions with non-aggregate columns?", options: ["ORDER BY", "GROUP BY", "WHERE", "HAVING"], correct: 1, explanation: "Non-aggregated columns must be listed in GROUP BY." },
    { topic: "Aggregation & Grouping", question: "What is the difference between `COUNT(*)` and `COUNT(column)`?", options: ["No difference", "COUNT(column) ignores NULLs; COUNT(*) counts all rows", "COUNT(*) ignores NULLs", "COUNT(column) counts duplicates only"], correct: 1, explanation: "COUNT(*) counts rows; COUNT(column) counts non-NULL values." },
    { topic: "Aggregation & Grouping", question: "Which aggregate returns the number of non-NULL values in a column?", options: ["COUNT(column)", "SUM(column)", "COUNT(*)", "AVG(column)"], correct: 0, explanation: "COUNT(column) ignores NULL values." },
    { topic: "Aggregation & Grouping", question: "What does HAVING do?", options: ["Filters rows before grouping", "Filters groups after aggregation", "Sorts groups", "Removes duplicates"], correct: 1, explanation: "HAVING is evaluated after GROUP BY." },
    { topic: "Aggregation & Grouping", question: "Can WHERE reference aggregate functions?", options: ["Yes", "No", "Only SUM", "Only with HAVING"], correct: 1, explanation: "WHERE operates before aggregation; use HAVING for aggregates." },
    { topic: "Aggregation & Grouping", question: "Which aggregate counts all rows, including rows with NULL in every column?", options: ["COUNT(column)", "COUNT(*)", "SUM", "AVG"], correct: 1, explanation: "COUNT(*) counts entire rows regardless of NULLs." },
    { topic: "Aggregation & Grouping", question: "What is the difference between WHERE and HAVING?", options: ["WHERE filters groups; HAVING filters rows", "WHERE filters before grouping; HAVING filters after grouping", "They are the same", "HAVING runs before WHERE"], correct: 1, explanation: "WHERE → GROUP BY → HAVING is the logical order." },
    { topic: "Aggregation & Grouping", question: "In standard SQL, can you refer to a SELECT column alias in the WHERE clause?", options: ["Yes", "No", "Only for numeric aliases", "Only in PostgreSQL"], correct: 1, explanation: "WHERE is evaluated before SELECT aliases are available." },
    { topic: "Aggregation & Grouping", question: "Which aggregate returns the highest value in a group?", options: ["MIN", "MAX", "TOP", "GREATEST"], correct: 1, explanation: "MAX returns the maximum value." },
    { topic: "Aggregation & Grouping", question: "Which clause is processed first?", options: ["HAVING", "GROUP BY", "WHERE", "SELECT"], correct: 2, explanation: "Logical order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `sales(region, amount)`:\n('East',100), ('West',200), ('East',150), ('North',300)\n\nQuery:\nSELECT region, SUM(amount)\nFROM sales\nGROUP BY region\nHAVING SUM(amount) > 200;\nWhich regions are returned?", options: ["East only", "North only", "East and North", "West and North"], correct: 2, explanation: "East = 250, North = 300; both > 200. West = 200, not > 200." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `emp(dept_id, salary)`:\n(10,1000), (10,1500), (20,2000), (20,NULL), (30,3000)\n\nQuery:\nSELECT dept_id, AVG(salary)\nFROM emp\nGROUP BY dept_id\nORDER BY dept_id;\nWhat is the average for dept 20?", options: ["2000", "1000", "NULL", "1500"], correct: 0, explanation: "AVG ignores NULL; only 2000 remains, so average = 2000." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `orders(customer_id, order_id)`:\n(1,101), (1,102), (2,103), (3,104), (3,105), (3,106)\n\nQuery:\nSELECT customer_id, COUNT(order_id)\nFROM orders\nGROUP BY customer_id\nHAVING COUNT(order_id) >= 2\nORDER BY customer_id;\nHow many rows are returned?", options: ["1", "2", "3", "4"], correct: 1, explanation: "Customers 1 and 3 have ≥2 orders → 2 rows." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `t(val)`: 1, 2, 2, 3, 3, 3, NULL\n\nQuery:\nSELECT COUNT(DISTINCT val) FROM t;", options: ["3", "4", "6", "7"], correct: 0, explanation: "Distinct non-NULL values are 1, 2, 3 → count = 3." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `employees(name, salary, dept)`:\n('A',3000,'HR'), ('B',4000,'IT'), ('C',3500,'HR'), ('D',5000,'IT')\n\nQuery:\nSELECT dept, MAX(salary)\nFROM employees\nGROUP BY dept;\nWhich rows are returned?", options: ["HR 3500, IT 5000", "HR 3000, IT 4000", "HR 3500, IT 4000", "HR 3000, IT 5000"], correct: 0, explanation: "HR max is 3500; IT max is 5000." },
    { topic: "Aggregation & Grouping - Sample Execute", question: "Table `orders(id, amount)`: (1,100), (2,200), (3,NULL), (4,400)\n\nQuery:\nSELECT SUM(amount), COUNT(amount), AVG(amount) FROM orders;", options: ["700, 4, 233.33", "700, 3, 233.33", "700, 3, 175", "700, 4, 175"], correct: 1, explanation: "SUM ignores NULL = 700; COUNT(amount)=3; AVG = 700/3 = 233.33." },

    { topic: "Subqueries, CTEs & Window Functions", question: "Which subquery returns a single value?", options: ["Row subquery", "Scalar subquery", "Table subquery", "Correlated subquery"], correct: 1, explanation: "A scalar subquery returns exactly one column and one row." },
    { topic: "Subqueries, CTEs & Window Functions", question: "What is a correlated subquery?", options: ["A subquery executed once", "A subquery that references the outer query and runs per outer row", "A subquery with no relation", "A subquery in the FROM clause"], correct: 1, explanation: "Correlated subqueries depend on outer query columns." },
    { topic: "Subqueries, CTEs & Window Functions", question: "Which operator returns true if a subquery contains any rows?", options: ["IN", "EXISTS", "ANY", "ALL"], correct: 1, explanation: "EXISTS checks whether the subquery returns at least one row." },
    { topic: "Subqueries, CTEs & Window Functions", question: "Why does `NOT IN` often return no rows when the subquery contains NULL?", options: ["NULL comparison yields unknown", "The subquery is empty", "NOT IN does not support subqueries", "NULLs are ignored"], correct: 0, explanation: "`x NOT IN (..., NULL)` becomes unknown for all rows." },
    { topic: "Subqueries, CTEs & Window Functions", question: "What does the `WITH` clause define?", options: ["A CTE / temporary named result set", "A view", "An index", "A cursor"], correct: 0, explanation: "WITH defines a Common Table Expression usable in the main query." },
    { topic: "Subqueries, CTEs & Window Functions", question: "Which window function assigns a unique sequential number without gaps?", options: ["RANK", "DENSE_RANK", "ROW_NUMBER", "NTILE"], correct: 2, explanation: "ROW_NUMBER gives consecutive numbers; RANK/DENSE_RANK may tie." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Table `orders(id, customer_id, amount)`:\n(1,1,100), (2,2,200), (3,1,150), (4,3,300)\n\nQuery:\nSELECT customer_id, SUM(amount)\nFROM orders\nGROUP BY customer_id\nHAVING SUM(amount) > (SELECT AVG(amount) FROM orders);\nWhich customer IDs are returned?", options: ["1 only", "1 and 2", "1, 2, and 3", "None"], correct: 2, explanation: "Overall AVG = 187.5; customer totals are 250, 200, 300, all above." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Tables:\n`employees(id, name, dept_id)`: (1,'A',10), (2,'B',20), (3,'C',10), (4,'D',30)\n`departments(id, name)`: (10,'HR'), (20,'IT')\n\nQuery:\nSELECT e.name\nFROM employees e\nWHERE e.dept_id NOT IN (SELECT id FROM departments);", options: ["A", "B", "C", "D"], correct: 3, explanation: "D has dept_id 30, which is not in departments." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Table `emp(id, name, salary, dept)`:\n(1,'A',3000,10), (2,'B',4000,10), (3,'C',5000,20), (4,'D',2000,20)\n\nQuery:\nSELECT name, RANK() OVER (ORDER BY salary DESC) AS rnk\nFROM emp\nORDER BY rnk;\nWhat is C's rank?", options: ["1", "2", "3", "4"], correct: 0, explanation: "C has the highest salary, so RANK = 1." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Same table as previous.\n\nQuery:\nSELECT name, salary,\n       DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS dr\nFROM emp;\nWhich employees have `dr = 1`?", options: ["B only", "C only", "B and C", "A and D"], correct: 2, explanation: "B is highest in dept 10; C is highest in dept 20." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Table `sales(month, revenue)`: ('Jan',100), ('Feb',150), ('Mar',120)\n\nQuery:\nSELECT month, revenue,\n       LAG(revenue) OVER (ORDER BY month) AS prev\nFROM sales\nORDER BY month;\nWhat is `prev` for March?", options: ["150", "120", "100", "NULL"], correct: 0, explanation: "LAG returns previous row's revenue; February's revenue is 150." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Table `emp(id, name, salary)`:\n(1,'A',3000), (2,'B',4000), (3,'C',3500), (4,'D',5000)\n\nQuery:\nSELECT name, salary\nFROM (\n    SELECT name, salary,\n           ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn\n    FROM emp\n) t\nWHERE rn = 2;", options: ["B 4000", "C 3500", "A 3000", "D 5000"], correct: 0, explanation: "Salary order: D(5000)=1, B(4000)=2, C(3500)=3, A(3000)=4." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Table `orders(id, amount)`: (1,100), (2,200), (3,150), (4,50)\n\nQuery:\nWITH high AS (\n    SELECT id, amount\n    FROM orders\n    WHERE amount > 100\n)\nSELECT COUNT(*) FROM high;", options: ["1", "2", "3", "4"], correct: 1, explanation: "Amounts greater than 100 are 200 and 150 → count = 2." },
    { topic: "Subqueries, CTEs & Window Functions - Sample Execute", question: "Query:\nWITH RECURSIVE t(n) AS (\n    SELECT 1\n    UNION ALL\n    SELECT n + 1 FROM t WHERE n < 3\n)\nSELECT SUM(n) FROM t;", options: ["3", "4", "6", "10"], correct: 2, explanation: "The sequence is 1, 2, 3 → SUM = 6." },

    { topic: "Transactions & Concurrency", question: "What does ACID stand for?", options: ["Atomicity, Consistency, Isolation, Durability", "Accuracy, Consistency, Isolation, Durability", "Atomicity, Concurrency, Isolation, Durability", "Atomicity, Consistency, Indexing, Durability"], correct: 0, explanation: "ACID defines reliable transaction properties." },
    { topic: "Transactions & Concurrency", question: "Which isolation level prevents dirty reads but allows non-repeatable reads?", options: ["READ UNCOMMITTED", "READ COMMITTED", "REPEATABLE READ", "SERIALIZABLE"], correct: 1, explanation: "READ COMMITTED sees only committed data but each read can differ." },
    { topic: "Transactions & Concurrency", question: "Which isolation level prevents phantom reads?", options: ["READ UNCOMMITTED", "READ COMMITTED", "REPEATABLE READ", "SERIALIZABLE"], correct: 3, explanation: "SERIALIZABLE provides the highest isolation." },
    { topic: "Transactions & Concurrency", question: "What is a deadlock?", options: ["Two transactions waiting on each other to release locks", "A transaction that runs too long", "A lock on a single row", "A failed COMMIT"], correct: 0, explanation: "Deadlocks occur when transactions block each other cyclically." },
    { topic: "Transactions & Concurrency", question: "What does COMMIT do?", options: ["Saves transaction changes permanently", "Rolls back changes", "Creates a savepoint", "Releases only table locks"], correct: 0, explanation: "COMMIT makes transaction changes durable." },
    { topic: "Transactions & Concurrency", question: "What is a savepoint?", options: ["A point inside a transaction to which you can roll back", "A backup of the database", "A committed transaction", "A type of index"], correct: 0, explanation: "SAVEPOINT allows partial rollback within a transaction." },
    { topic: "Transactions & Concurrency", question: "In PostgreSQL, which isolation level is the default?", options: ["READ UNCOMMITTED", "READ COMMITTED", "REPEATABLE READ", "SERIALIZABLE"], correct: 1, explanation: "PostgreSQL defaults to READ COMMITTED." },
    { topic: "Transactions & Concurrency", question: "What is MVCC?", options: ["Multi-Version Concurrency Control", "Multi-Value Consistency Check", "Multi-Version Column Constraint", "Multi-View Concurrency Control"], correct: 0, explanation: "MVCC allows readers not to block writers by keeping row versions." },
    { topic: "Transactions & Concurrency - Sample Execute", question: "Table `accounts(id, balance)`: (1,100), (2,50)\n\nTransaction:\nBEGIN;\nUPDATE accounts SET balance = balance - 30 WHERE id = 1;\nUPDATE accounts SET balance = balance + 30 WHERE id = 2;\nCOMMIT;\nWhat are the final balances?", options: ["70 and 80", "100 and 50", "70 and 50", "100 and 80"], correct: 0, explanation: "Account 1: 100 − 30 = 70; Account 2: 50 + 30 = 80." },
    { topic: "Transactions & Concurrency - Sample Execute", question: "Table `accounts(id, balance)`: (1,100)\n\nTransaction:\nBEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nSAVEPOINT sp;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nROLLBACK TO sp;\nCOMMIT;\nWhat is the final balance for id=1?", options: ["0", "100", "-100", "200"], correct: 0, explanation: "After first update balance = 0; rollback to savepoint undoes second update." },

    { topic: "Performance Tips & Indexes", question: "Which index type is the default in PostgreSQL?", options: ["Hash", "B-tree", "GIN", "GiST"], correct: 1, explanation: "PostgreSQL defaults to B-tree for standard indexes." },
    { topic: "Performance Tips & Indexes", question: "Which Oracle index type is suitable for low-cardinality columns?", options: ["B-tree", "Bitmap", "Unique", "Function-based"], correct: 1, explanation: "Bitmap indexes work well on columns with few distinct values." },
    { topic: "Performance Tips & Indexes", question: "For a composite index on `(last_name, first_name)`, which query can use it most efficiently?", options: ["`WHERE first_name = 'John'`", "`WHERE last_name = 'Smith'`", "`WHERE last_name = 'Smith' AND first_name = 'John'`", "`WHERE first_name = 'John' OR last_name = 'Smith'`"], correct: 2, explanation: "The query uses the leftmost prefix and both indexed columns." },
    { topic: "Performance Tips & Indexes", question: "What is a covering index?", options: ["An index that includes all columns needed by the query, avoiding table access", "An index on all columns", "An index with a fill factor", "An index on only the primary key"], correct: 0, explanation: "Covering indexes satisfy the query from the index alone." },
    { topic: "Performance Tips & Indexes", question: "Which SQL command shows the query plan in PostgreSQL?", options: ["EXPLAIN", "DESCRIBE", "SHOW PLAN", "PLAN"], correct: 0, explanation: "EXPLAIN displays the execution plan chosen by the optimizer." },
    { topic: "Performance Tips & Indexes", question: "Why should you avoid wrapping an indexed column in a function in WHERE?", options: ["It prevents index usage", "It causes errors", "It increases index size", "It returns wrong results"], correct: 0, explanation: "`WHERE UPPER(name) = 'X'` cannot use a normal index on `name`." },
    { topic: "Performance Tips & Indexes", question: "Which condition is sargable?", options: ["`WHERE date_trunc('day', created_at) = '2024-01-01'`", "`WHERE created_at >= '2024-01-01' AND created_at < '2024-01-02'`", "`WHERE UPPER(name) = 'JOHN'`", "`WHERE salary + 100 > 5000`"], correct: 1, explanation: "Sargable conditions allow direct index range scans." },
    { topic: "Performance Tips & Indexes", question: "What does `VACUUM ANALYZE` do in PostgreSQL?", options: ["Reclaims dead tuples and updates optimizer statistics", "Rebuilds indexes only", "Locks tables for writes", "Deletes all rows"], correct: 0, explanation: "VACUUM cleans up dead rows; ANALYZE updates statistics." },
    { topic: "Performance Tips & Indexes", question: "Which pagination method is usually faster for deep pages?", options: ["`OFFSET 10000 LIMIT 10`", "Keyset pagination using `WHERE id > last_id ORDER BY id LIMIT 10`", "`ORDER BY random() LIMIT 10`", "`LIMIT 10000 OFFSET 10`"], correct: 1, explanation: "Keyset pagination avoids scanning and skipping many rows." },
    { topic: "Performance Tips & Indexes", question: "What is the N+1 query problem?", options: ["Application runs one query plus one query per row in a loop", "Query returns N+1 columns", "There are N+1 indexes on a table", "SQL injection risk"], correct: 0, explanation: "N+1 causes many round trips; use JOINs or batch loading." },
    { topic: "Performance Tips & Indexes", question: "Why is `SELECT *` discouraged in production?", options: ["It fetches unnecessary columns, increasing I/O and breaking if schema changes", "It is a syntax error", "It is slower only in parsing", "It cannot be used with joins"], correct: 0, explanation: "Explicit columns improve performance and stability." },
    { topic: "Performance Tips & Indexes", question: "What do bind variables help prevent?", options: ["SQL injection and excessive hard parsing", "Deadlocks", "Index fragmentation", "Table locks"], correct: 0, explanation: "Bind variables reuse execution plans and avoid concatenation risks." },
    { topic: "Performance Tips & Indexes", question: "Which join can cause performance problems if tables are large and no condition is given?", options: ["INNER JOIN", "LEFT JOIN", "CROSS JOIN", "SELF JOIN"], correct: 2, explanation: "CROSS JOIN produces a Cartesian product." },
    { topic: "Performance Tips & Indexes", question: "What is partitioning used for?", options: ["Improving manageability and performance on large tables", "Replacing indexes", "Normalizing data", "Encrypting data"], correct: 0, explanation: "Partitioning splits large tables into smaller physical pieces." },
    { topic: "Performance Tips & Indexes", question: "Which statistics help the optimizer choose a good query plan?", options: ["Row counts and data distribution histograms", "Number of columns", "Index names", "Constraint names"], correct: 0, explanation: "Optimizers use table/index statistics to estimate row counts." },
    { topic: "Performance Tips & Indexes", question: "In PostgreSQL, what does `EXPLAIN (ANALYZE, BUFFERS)` show?", options: ["Actual execution time and buffer usage", "Only the estimated plan", "Syntax errors", "Table DDL"], correct: 0, explanation: "ANALYZE executes the query; BUFFERS shows shared buffer reads." },
    { topic: "Performance Tips & Indexes - Sample Execute", question: "EXPLAIN output:\nIndex Scan using idx_emp_dept on employees  (cost=0.29..8.31 rows=1 width=...)\n  Filter: (dept_id = 10)\nWhat does this indicate?", options: ["The query uses an index to find rows", "The query scans the whole table", "There is no index", "The table is empty"], correct: 0, explanation: "Index Scan means the database is using idx_emp_dept to locate rows." },
    { topic: "Performance Tips & Indexes - Sample Execute", question: "Table `products(id, name, price)` has an index on `price`.\n\nQuery A:\nSELECT * FROM products WHERE price + 10 > 100;\nQuery B:\nSELECT * FROM products WHERE price > 90;\nWhich query is likely faster?", options: ["Query A", "Query B", "Both are the same", "Depends on NULLs"], correct: 1, explanation: "Query B is sargable and can use the index on `price`; Query A prevents index use." },
    { topic: "Performance Tips & Indexes - Sample Execute", question: "Query plan:\nSeq Scan on large_table  (cost=0.00..4321.00 rows=100000 width=100)\n  Filter: (LOWER(name) = 'john')\nWhy does the planner use a Seq Scan?", options: ["LOWER(name) prevents normal index usage", "The table is small", "Only because an index is missing", "The query is too simple"], correct: 0, explanation: "Applying a function to the indexed column makes the predicate non-sargable." },
    { topic: "Performance Tips & Indexes - Sample Execute", question: "Table `employees(id, name, dept_id, salary)` has a composite index on `(dept_id, salary)`.\n\nWhich query can use this index most efficiently?", options: ["SELECT * FROM employees WHERE salary > 5000;", "SELECT * FROM employees WHERE dept_id = 10 AND salary > 5000;", "SELECT * FROM employees WHERE name = 'A';", "SELECT * FROM employees WHERE dept_id + 1 = 10;"], correct: 1, explanation: "Query B uses the leftmost prefix and a range on the second index column." },

    { topic: "Database Design & Constraints", question: "What is a primary key?", options: ["A unique, NOT NULL identifier for a table", "Any unique column allowing NULL", "A foreign key", "Only an index"], correct: 0, explanation: "Primary keys uniquely identify rows and cannot contain NULL." },
    { topic: "Database Design & Constraints", question: "What does a foreign key enforce?", options: ["Referential integrity", "Uniqueness", "NOT NULL", "Data type"], correct: 0, explanation: "Foreign keys ensure child rows reference existing parent rows." },
    { topic: "Database Design & Constraints", question: "Which constraint ensures column values satisfy a logical condition?", options: ["CHECK", "UNIQUE", "DEFAULT", "PRIMARY KEY"], correct: 0, explanation: "CHECK constraints validate values against an expression." },
    { topic: "Database Design & Constraints", question: "What is normalization?", options: ["Reducing redundancy and dependency by organizing tables", "Denormalizing for speed", "Adding indexes", "Partitioning tables"], correct: 0, explanation: "Normalization reduces data duplication and update anomalies." },
    { topic: "Database Design & Constraints", question: "Which normal form eliminates transitive dependencies?", options: ["1NF", "2NF", "3NF", "4NF"], correct: 2, explanation: "3NF removes non-key columns that depend on other non-key columns." },
    { topic: "Database Design & Constraints", question: "What does `ON DELETE CASCADE` do?", options: ["Deletes child rows when the parent row is deleted", "Prevents parent deletion", "Sets child FK to NULL", "Deletes the parent automatically when child is deleted"], correct: 0, explanation: "CASCADE propagates the delete to dependent child rows." },
    { topic: "Database Design & Constraints", question: "What is denormalization?", options: ["Intentionally adding redundancy to improve read performance", "Removing redundant columns", "Creating indexes", "Splitting tables"], correct: 0, explanation: "Denormalization trades storage and update complexity for faster reads." },
    { topic: "Database Design & Constraints", question: "In ERD notation, what does crow's foot represent?", options: ["The many side of a relationship", "The one side of a relationship", "The primary key", "The foreign key"], correct: 0, explanation: "Crow's foot indicates “many” cardinality." },
